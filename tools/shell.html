<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编码工具箱 · 离线单文件版</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#2f2c26; --sub:#7c7568;
    --line:#e5e0d5; --accent:#8a6a3d; --accent-soft:#f2e9da;
    --ok:#3d7d58; --err:#b4453a; --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    --shadow:0 1px 3px rgba(60,50,35,.07),0 8px 24px rgba(60,50,35,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
       font-size:14px;line-height:1.65}
  header{padding:22px 20px 14px;text-align:center;border-bottom:1px solid var(--line);background:#fbf9f5}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:3px;font-weight:600}
  .sub{color:var(--sub);font-size:12px}
  .app{display:flex;gap:16px;max-width:1240px;margin:0 auto;padding:16px}
  aside{width:248px;flex:0 0 248px}
  main{flex:1;min-width:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
         box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
  .panel h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--accent)}
  .grp{margin-bottom:6px}
  .grp>.gh{width:100%;text-align:left;border:1px solid var(--line);background:#fbfaf7;color:var(--ink);
           border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-family:inherit;
           display:flex;justify-content:space-between;align-items:center}
  .grp>.gh:hover{border-color:var(--accent)}
  .grp .cnt{color:var(--sub);font-size:11px}
  .items{display:none;padding:6px 0 8px;max-height:300px;overflow:auto}
  .grp.open .items{display:block}
  .items button{display:block;width:100%;text-align:left;border:0;background:transparent;
                padding:5px 11px;cursor:pointer;font-size:13px;color:var(--sub);
                font-family:inherit;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .items button:hover{background:#f6f2ea;color:var(--ink)}
  .items button.on{background:var(--accent);color:#fff}
  input[type=search],input[type=text],select,textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;
    font-size:13px;background:#fdfcfa;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
  textarea{min-height:130px;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.75}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
       padding:7px 15px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.88;color:#fff}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .status{margin-top:9px;font-size:12px;min-height:18px;word-break:break-all}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .iohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .iohead span{font-size:12px;color:var(--sub)}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:5px;
       padding:1px 7px;font-size:11px;margin-left:6px}
  .note{font-size:12px;color:var(--sub);margin:6px 0 0}
  .kbd{font-family:var(--mono);background:#f4f0e8;border-radius:4px;padding:0 4px;font-size:11px}
  @media(max-width:820px){.app{flex-direction:column}aside{width:auto;flex:none}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>编 码 工 具 箱</h1>
  <div class="sub">纯前端零依赖 · 断网可用 · <span id="stat"></span></div>
</header>

<div class="app">
  <aside>
    <div class="panel" style="padding:10px">
      <input type="search" id="q" placeholder="搜索算法…">
    </div>
    <div class="panel" id="nav"></div>
  </aside>

  <main>
    <div class="panel">
      <h3 id="title">请从左侧选择算法<span id="tag" class="tag" style="display:none"></span></h3>
      <div id="params"></div>
      <div class="note" id="desc"></div>
    </div>

    <div class="panel">
      <div class="iohead"><span>输入</span><span id="inlen"></span></div>
      <textarea id="in" placeholder="在此输入文本…"></textarea>
      <div class="row" style="margin:10px 0">
        <button class="btn primary" id="bEnc">编码 / 计算 →</button>
        <button class="btn" id="bDec">← 解码</button>
        <button class="btn" id="bSwap">上下互换</button>
        <button class="btn" id="bCopy">复制结果</button>
        <button class="btn" id="bClear">清空</button>
        <span class="note" style="margin:0">快捷键 <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> 编码</span>
      </div>
      <div class="iohead"><span>输出</span><span id="outlen"></span></div>
      <textarea id="out" placeholder="结果…"></textarea>
      <div class="status" id="st"></div>
    </div>

    <div class="panel" id="rsaPanel" style="display:none">
      <h3>RSA 工具箱</h3>
      <div class="grid3">
        <div class="field"><label>密钥位数</label>
          <select id="rsaBits"><option>512</option><option selected>1024</option><option>2048</option></select></div>
        <div class="field"><label>公钥指数 e</label><input type="text" id="rsaE" value="65537"></div>
        <div class="field"><label>填充 / 模式</label>
          <select id="rsaPad">
            <option>PKCS1v15</option><option>OAEP-SHA1</option><option>OAEP-SHA256</option><option>Raw</option>
          </select></div>
      </div>
      <div class="row" style="margin-bottom:9px">
        <button class="btn primary" id="rsaGen">生成密钥对</button>
        <button class="btn" id="rsaParse">载入密钥</button>
        <button class="btn" id="rsaShow">导出 PEM</button>
        <button class="btn" id="rsaFactor">分解模数 n</button>
      </div>
      <div class="field"><label>密钥（PEM，或 {n,e,d} JSON；生成后自动填入）</label>
        <textarea id="rsaKey" style="min-height:80px"></textarea></div>
      <div class="row">
        <button class="btn" id="rsaEnc">公钥加密</button>
        <button class="btn" id="rsaDec">私钥解密</button>
        <button class="btn" id="rsaSign">私钥签名</button>
        <button class="btn" id="rsaVer">公钥验签</button>
      </div>
      <div class="field" style="margin-top:9px"><label>签名 / 验签用原文（留空则取「输入」框）</label>
        <textarea id="rsaMsg" style="min-height:60px"></textarea></div>
      <div class="note">加解密走「输入 / 输出」框：加密结果以 HEX 输出，解密时把 HEX 粘进「输入」框。
        签名结果放进「输出」框，验签时把签名 HEX 粘进「输入」框。</div>
    </div>
  </main>
</div>

<!--__BUNDLE__-->

<script>
(function () {
  const CT = window.CT, U = CT.util;
  const $ = id => document.getElementById(id);
  const hex = b => U.hex(U.asBytes(b), false);

  /* ==================== 注册表 ==================== */
  const GROUPS = [];
  const addGroup = (name, items, note) => GROUPS.push({ name, items, note: note || '' });

  /* 1) 经典哈希：core 自有 + Whirlpool（不含 hashex / hash2 的其余项） */
  const HX = CT.hashex.MAP, H2 = CT.hash2.MAP;
  const CLASSIC = Object.keys(CT.hash.ALGOS).filter(k => !HX[k] && !H2[k]);
  addGroup('哈希', CLASSIC.map(k => {
    const a = CT.hash.ALGOS[k];
    return {
      name: k, oneWay: true, note: (a.out ? a.out + ' 字节摘要' : '32 位有符号整数'),
      enc: s => (k === 'JavaHash' ? U.utf8Dec(a.fn(U.utf8Enc(s))) : hex(a.fn(U.utf8Enc(s))))
    };
  }), 'MD / SHA / SHA-3 / RIPEMD / SM3 / CRC / Adler32 / Whirlpool');

  /* 2) 快速哈希（非密码学 + BLAKE2） */
  addGroup('快速哈希', Object.keys(HX).map(k => {
    const a = HX[k];
    return { name: k, oneWay: true, note: a.out + ' 字节 · ' + a.kind, enc: s => hex(a.fn(U.utf8Enc(s))) };
  }), 'BLAKE2 / FNV / xxHash / Murmur3 / DJB2 / SDBM / CRC-8·64 / NT-Hash');

  /* 3) 扩展哈希：XOF / 键控 / 校验和 */
  const h2Item = {
    'SHAKE128': { params: [{ k: 'len', label: '输出字节数', type: 'int', def: 32 }],
                  enc: (s, p) => hex(CT.hash2.shake128(U.utf8Enc(s), p.len || 32)) },
    'SHAKE256': { params: [{ k: 'len', label: '输出字节数', type: 'int', def: 64 }],
                  enc: (s, p) => hex(CT.hash2.shake256(U.utf8Enc(s), p.len || 64)) },
    'SipHash-2-4': { params: [{ k: 'key', label: '密钥（HEX，16 字节；留空用全零）', type: 'text', def: '' }],
                     enc: (s, p) => hex(CT.hash2.siphash24(U.utf8Enc(s), keyHex(p.key, 16))) },
    'Poly1305': { params: [{ k: 'key', label: '一次性密钥（HEX，32 字节；留空用全零）', type: 'text', def: '' }],
                  enc: (s, p) => hex(CT.hash2.poly1305(U.utf8Enc(s), keyHex(p.key, 32))) }
  };
  addGroup('扩展哈希', Object.keys(H2).map(k => {
    const a = H2[k], ex = h2Item[k];
    return {
      name: k, oneWay: true, note: a.out + ' 字节 · ' + a.kind,
      params: ex ? ex.params : [],
      enc: ex ? ex.enc : (s => hex(a.fn(U.utf8Enc(s))))
    };
  }), 'Whirlpool / SHAKE / SipHash / Poly1305 / Fletcher / ELF / Jenkins / FNV-1a-128 / sum');
  function keyHex(s, n) {
    const t = (s || '').replace(/\s+/g, '');
    if (!t) return new Uint8Array(n);
    const b = U.unhex(t);
    if (b.length !== n) throw new Error('需要 ' + n + ' 字节密钥（HEX ' + n * 2 + ' 位），实际 ' + b.length + ' 字节');
    return b;
  }

  /* 4) BASE 编码 */
  const BASE_LIST = [
    ['Base16', 'b16e', 'b16d'], ['Base32', 'b32e', 'b32d'], ['Base32-Hex', 'b32hexe', 'b32hexd'],
    ['Base36', 'b36e', 'b36d'], ['Base45', 'b45e', 'b45d'], ['Base58', 'b58e', 'b58d'],
    ['Base58Check', 'b58checke', 'b58checkd'], ['Base62', 'b62e', 'b62d'],
    ['Base64', 'b64e', 'b64d'], ['Base64-URL', 'b64ue', 'b64ud'],
    ['Base85(Ascii85)', 'b85e', 'b85d'], ['Base91', 'b91e', 'b91d'],
    ['Crockford-Base32', 'crocke', 'crockd'], ['Z85', 'z85e', 'z85d']
  ];
  const baseItems = BASE_LIST.map(([n, e, d]) => ({
    name: n, note: '字节 ↔ 文本',
    enc: s => CT.base[e](U.utf8Enc(s)),
    dec: s => U.utf8Dec(CT.base[d](s))
  }));
  // Z85 要求 4 字节一组：编码时右侧补 0x00 到 4 的倍数，解码时去掉补位的尾零
  const z85 = baseItems.find(x => x.name === 'Z85');
  z85.note = '字节 ↔ 文本（4 字节一组，不足时自动补 0x00）';
  z85.enc = s => {
    const b0 = U.utf8Enc(s);
    const pad = (4 - b0.length % 4) % 4;
    const b = pad ? (() => { const t = new Uint8Array(b0.length + pad); t.set(b0); return t; })() : b0;
    return CT.base.z85e(b);
  };
  z85.dec = s => {
    const b = CT.base.z85d(s);
    let n = b.length; while (n > 0 && b[n - 1] === 0) n--;
    return U.utf8Dec(b.subarray(0, n));
  };
  addGroup('BASE 编码', baseItems, 'Base16/32/36/45/58/62/64/85/91 + Crockford + Z85');

  /* 5) 对称加密 */
  const CIPHER_ALGOS = ['AES', 'DES', '3DES', 'SM4', 'RC4', 'XOR'];
  addGroup('对称加密', CIPHER_ALGOS.map(a => ({
    name: a,
    note: a === 'RC4' || a === 'XOR' ? '流密码：无分组模式与填充' : '分组密码：需选模式与填充',
    params: [
      { k: 'key', label: '密钥（文本）', type: 'text', def: '1234567890123456' },
      { k: 'keyHex', label: '密钥按 HEX 解析', type: 'bool', def: false },
      { k: 'mode', label: '模式', type: 'select', def: 'CBC', opts: ['ECB', 'CBC', 'CFB', 'OFB', 'CTR', 'PCBC'] },
      { k: 'padding', label: '填充', type: 'select', def: 'PKCS7', opts: ['PKCS7', 'Zero', 'ISO10126', 'None'] },
      { k: 'iv', label: 'IV（文本，可留空）', type: 'text', def: '' },
      { k: 'out', label: '密文输出', type: 'select', def: 'HEX', opts: ['HEX', 'Base64'] }
    ],
    enc: (s, p) => fmtOut(CT.cipher.encrypt({
      algo: a, mode: p.mode, padding: p.padding,
      key: keyBytes(p), iv: U.utf8Enc(p.iv || ''), data: U.utf8Enc(s)
    }), p.out),
    dec: (s, p) => U.utf8Dec(CT.cipher.decrypt({
      algo: a, mode: p.mode, padding: p.padding,
      key: keyBytes(p), iv: U.utf8Enc(p.iv || ''), data: parseIn(s, p.out)
    }))
  })), 'AES / DES / 3DES / SM4 / RC4 / XOR');
  function keyBytes(p) { return p.keyHex ? U.unhex((p.key || '').replace(/\s+/g, '')) : U.utf8Enc(p.key || ''); }
  function fmtOut(b, kind) { return kind === 'Base64' ? CT.base.b64e(U.asBytes(b)) : hex(b); }
  function parseIn(s, kind) { return kind === 'Base64' ? CT.base.b64d(s.trim()) : U.unhex(s.replace(/\s+/g, '')); }

  /* 6) 表驱动的工具组 */
  const toolGroup = (name, T, note) => addGroup(name, Object.keys(T).map(k => {
    const t = T[k];
    return {
      name: k, note: '', oneWay: !!t.oneWay, selfInverse: !!t.selfInverse,
      params: t.params || [],
      enc: (s, p) => t.enc(s, p),
      dec: (s, p) => t.dec(s, p)
    };
  }), note);
  toolGroup('古典密码', CT.classic.TOOLS, '凯撒 / 维吉尼亚 / Playfair / Hill / 栅栏 / ADFGVX …');
  toolGroup('中文趣味', CT.cncode.TOOLS, '与佛论禅 / 佛曰 / 核心价值观 / 脑洞 / 零宽 / 卦象 …');
  toolGroup('实用工具', CT.misc.TOOLS, 'URL / HTML / Unicode / 进制 / 反转 …');
  toolGroup('老式编码', CT.legacy.TOOLS, 'UU / XX / Ascii85 / Base92 / yEnc / Punycode / EBCDIC / 盲文 …');

  /* 7) RSA 专用入口 */
  addGroup('RSA', [{ name: 'RSA 密钥与运算', note: '生成 / 解析 / 加解密 / 签名 / 分解攻击', rsa: true }], '纯 JS 大数实现');

  /* 部分算法对默认样本不友好，给专属示例 */
  const SAMPLES = {
    '进制互转': '255',
    'URL 编码(整体)': 'https://example.com/a b?x=1&y=中文',
    '表单编码': 'name=张三&city=Beijing',
    'IDNA 域名': 'bücher.example',
    'Punycode': 'bücher',
    'Hexdump': 'Hello',
    'RSA 密钥与运算': 'Hello RSA'
  };

  /* ==================== 侧栏 ==================== */
  let cur = null, curGroup = 0;
  const nav = $('nav');
  function renderNav() {
    const filter = $('q').value.trim().toLowerCase();
    nav.innerHTML = '';
    GROUPS.forEach((g, gi) => {
      let items = g.items;
      if (filter) items = items.filter(it => (it.name + ' ' + g.name).toLowerCase().includes(filter));
      if (!items.length) return;
      const d = document.createElement('div');
      d.className = 'grp' + (curGroup === gi || filter ? ' open' : '');
      const h = document.createElement('button');
      h.className = 'gh';
      h.innerHTML = '<span>' + g.name + '</span><span class="cnt">' + items.length + '</span>';
      h.onclick = () => { curGroup = curGroup === gi ? null : gi; renderNav(); };
      d.appendChild(h);
      const box = document.createElement('div');
      box.className = 'items';
      items.forEach(it => {
        const b = document.createElement('button');
        b.textContent = it.name;
        if (cur && cur.name === it.name) b.className = 'on';
        b.onclick = () => { select(it); curGroup = gi; renderNav(); };
        box.appendChild(b);
      });
      d.appendChild(box);
      nav.appendChild(d);
    });
  }
  $('q').oninput = renderNav;

  /* ==================== 参数区 ==================== */
  let paramVals = {};
  function select(it) {
    cur = it;                                   // 选中即生效（外部调用 select 也能直接 run）
    $('title').firstChild.nodeValue = it.name;
    const tag = $('tag');
    tag.style.display = it.oneWay ? 'inline-block' : 'none';
    tag.textContent = it.oneWay ? '单向' : '';
    $('desc').textContent = it.note || '';
    $('bEnc').style.display = it.rsa ? 'none' : '';
    $('bDec').style.display = (it.rsa || it.oneWay) ? 'none' : '';
    $('rsaPanel').style.display = it.rsa ? 'block' : 'none';
    if (it.rsa) $('desc').textContent = '生成 / 解析 RSA 密钥，进行加解密、签名验签与模数分解攻击（下方专用面板）';

    const box = $('params'); box.innerHTML = ''; paramVals = {};
    if (it.params && it.params.length) {
      const g = document.createElement('div');
      g.className = 'grid3';
      it.params.forEach(p => {
        paramVals[p.k] = p.def;
        const f = document.createElement('div'); f.className = 'field';
        const l = document.createElement('label'); l.textContent = p.label; f.appendChild(l);
        let el;
        if (p.type === 'select' || p.type === 'bool') {
          el = document.createElement('select');
          const opts = p.type === 'bool' ? ['false', 'true'] : p.opts;
          opts.forEach(o => { const o1 = document.createElement('option'); o1.value = o1.textContent = o; el.appendChild(o1); });
          el.value = String(p.def);
          el.onchange = () => { paramVals[p.k] = p.type === 'bool' ? (el.value === 'true') : el.value; };
        } else {
          el = document.createElement('input'); el.type = 'text'; el.value = String(p.def);
          el.oninput = () => { paramVals[p.k] = p.type === 'int' ? (parseInt(el.value, 10) || 0) : el.value; };
        }
        f.appendChild(el); g.appendChild(f);
      });
      box.appendChild(g);
    }
    $('in').value = SAMPLES[it.name] !== undefined ? SAMPLES[it.name] : ($('in').value || 'Hello, 世界! 123');
    $('inlen').textContent = $('in').value.length + ' 字符';
  }

  /* ==================== 执行 ==================== */
  function run(dir) {
    if (!cur) { say('请先从左侧选择算法', 'err'); return; }
    if (cur.rsa) { say('请使用下方 RSA 面板的按钮', 'err'); return; }
    const s = $('in').value;
    try {
      const fn = dir === 'enc' ? (cur.enc || cur.run) : cur.dec;
      if (!fn) { say('该算法不支持' + (dir === 'enc' ? '编码' : '解码'), 'err'); return; }
      const r = fn(s, paramVals);
      $('out').value = typeof r === 'string' ? r : String(r);
      $('outlen').textContent = $('out').value.length + ' 字符';
      say('完成 · ' + $('out').value.length + ' 字符', 'ok');
    } catch (e) { say('错误：' + (e && e.message ? e.message : e), 'err'); }
  }
  function say(m, k) { const st = $('st'); st.textContent = m; st.className = 'status ' + (k || ''); }
  $('bEnc').onclick = () => run('enc');
  $('bDec').onclick = () => run('dec');
  $('bSwap').onclick = () => { const a = $('in').value; $('in').value = $('out').value; $('out').value = a; $('inlen').textContent = $('in').value.length + ' 字符'; };
  $('bCopy').onclick = async () => {
    const t = $('out').value;
    try { await navigator.clipboard.writeText(t); say('已复制', 'ok'); }
    catch (e) { $('out').select(); try { document.execCommand('copy'); say('已复制', 'ok'); } catch (e2) { say('复制失败，请手动选中', 'err'); } }
  };
  $('bClear').onclick = () => { $('in').value = ''; $('out').value = ''; say(''); };
  $('in').oninput = () => { $('inlen').textContent = $('in').value.length + ' 字符'; };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run('enc'); }
  });

  /* ==================== RSA 面板 ==================== */
  const RSA = CT.rsa;
  let rsaKey = null;
  function rsaPadOpt() {
    const pad = $('rsaPad').value;
    return pad === 'Raw' ? { padding: 'Raw' }
         : pad.startsWith('OAEP') ? { padding: 'OAEP', hash: pad === 'OAEP-SHA256' ? 'SHA-256' : 'SHA-1' }
         : { padding: 'PKCS1v15' };
  }
  $('rsaGen').onclick = () => {
    try {
      const bits = parseInt($('rsaBits').value, 10);
      const e = BigInt($('rsaE').value.trim() || '65537');
      const t0 = performance.now();
      rsaKey = RSA.generate(bits, e);
      $('rsaKey').value = JSON.stringify({ n: rsaKey.n.toString(), e: rsaKey.e.toString(), d: rsaKey.d.toString() }, null, 1);
      say('已生成 ' + bits + ' 位密钥（n 实际 ' + rsaKey.n.toString(2).length + ' 位，用时 ' + Math.round(performance.now() - t0) + ' ms）', 'ok');
    } catch (err) { say('生成失败：' + err.message, 'err'); }
  };
  $('rsaParse').onclick = () => {
    try {
      const t = $('rsaKey').value.trim();
      if (!t) throw new Error('请先粘贴 PEM 或 {n,e,d} JSON');
      if (t.startsWith('-----')) rsaKey = RSA.parseKey(t);
      else {
        const o = JSON.parse(t);
        rsaKey = (o.d && o.n) ? RSA.keyFromNED(String(o.n), String(o.e || '65537'), String(o.d)) : RSA.parseKey(t);
      }
      say('已载入密钥 · ' + (rsaKey.bits || '?') + ' 位 · ' + (rsaKey.kind || ''), 'ok');
    } catch (err) { say('解析失败：' + err.message, 'err'); }
  };
  $('rsaShow').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入密钥');
      const parts = [];
      if (rsaKey.n && rsaKey.e) parts.push(RSA.exportPkcs1Public(rsaKey));
      if (rsaKey.d) parts.push(RSA.exportPkcs1Private(rsaKey));
      $('out').value = parts.join('\n');
      say('已导出 PEM 到输出框' + (rsaKey.d ? '（公钥 PKCS#1 + 私钥 PKCS#1）' : '（仅公钥，当前密钥无私钥部分）'), 'ok');
    } catch (err) { say(err.message, 'err'); }
  };
  $('rsaFactor').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入密钥');
      const bits = rsaKey.n.toString(2).length;
      if (bits > 256 && !confirm('模数 n 为 ' + bits + ' 位，暴力分解可能长时间无解并卡住页面。\n' +
        '（仅对弱密钥有效：p/q 接近、小因子、e 或 d 过小）\n确定继续？')) { say('已取消', ''); return; }
      const t0 = performance.now();
      const r = RSA.autoFactor(rsaKey.n, rsaKey.e);
      $('out').value = JSON.stringify({ p: r.p.toString(), q: r.q.toString(), method: r.method, ms: Math.round(performance.now() - t0) }, null, 1);
      say('分解成功 · ' + r.method, 'ok');
    } catch (err) { say('分解失败：' + err.message, 'err'); }
  };
  $('rsaEnc').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入密钥');
      const o = rsaPadOpt();
      const c = RSA.encrypt({ key: rsaKey, data: U.utf8Enc($('in').value), padding: o.padding, hash: o.hash });
      $('out').value = hex(c);
      say('已加密 · ' + c.length + ' 字节（' + o.padding + '）', 'ok');
    } catch (err) { say('加密失败：' + err.message, 'err'); }
  };
  $('rsaDec').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入含私钥的密钥');
      const o = rsaPadOpt();
      const m = RSA.decrypt({ key: rsaKey, data: U.unhex($('in').value.replace(/\s+/g, '')), padding: o.padding, hash: o.hash });
      $('out').value = U.utf8Dec(m);
      say('已解密', 'ok');
    } catch (err) { say('解密失败：' + err.message, 'err'); }
  };
  $('rsaSign').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入含私钥的密钥');
      const sig = RSA.sign({ key: rsaKey, data: U.utf8Enc($('rsaMsg').value || $('in').value), hash: 'SHA-256' });
      $('out').value = hex(sig);
      say('已签名（SHA-256 / PKCS#1 v1.5）', 'ok');
    } catch (err) { say('签名失败：' + err.message, 'err'); }
  };
  $('rsaVer').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入密钥');
      const ok = RSA.verify({ key: rsaKey, data: U.utf8Enc($('rsaMsg').value || $('in').value),
                              signature: U.unhex($('in').value.replace(/\s+/g, '')), hash: 'SHA-256' });
      say(ok ? '验签通过 ✓' : '验签失败 ✗', ok ? 'ok' : 'err');
    } catch (err) { say('验签出错：' + err.message, 'err'); }
  };

  /* ==================== 初始化 ==================== */
  const total = GROUPS.reduce((s, g) => s + g.items.length, 0);
  $('stat').textContent = GROUPS.length + ' 大类 / ' + total + ' 个算法';
  cur = GROUPS[0].items.find(i => i.name === 'SHA-256') || GROUPS[0].items[0];
  select(cur);
  renderNav();
  window.__CT_UI = { GROUPS, run, select, get cur() { return cur; } };
})();
</script>
</body>
</html>
