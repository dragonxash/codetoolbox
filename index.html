<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编码工具箱 · 离线单文件版</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#2f2c26; --sub:#7c7568;
    --line:#e5e0d5; --accent:#8a6a3d; --accent-soft:#f2e9da;
    --ok:#3d7d58; --err:#b4453a; --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    --shadow:0 1px 3px rgba(60,50,35,.07),0 8px 24px rgba(60,50,35,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
       font-size:14px;line-height:1.65}
  header{padding:22px 20px 14px;text-align:center;border-bottom:1px solid var(--line);background:#fbf9f5}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:3px;font-weight:600}
  .sub{color:var(--sub);font-size:12px}
  .app{display:flex;gap:16px;max-width:1240px;margin:0 auto;padding:16px}
  aside{width:248px;flex:0 0 248px}
  main{flex:1;min-width:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
         box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
  .panel h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--accent)}
  .grp{margin-bottom:6px}
  .grp>.gh{width:100%;text-align:left;border:1px solid var(--line);background:#fbfaf7;color:var(--ink);
           border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-family:inherit;
           display:flex;justify-content:space-between;align-items:center}
  .grp>.gh:hover{border-color:var(--accent)}
  .grp .cnt{color:var(--sub);font-size:11px}
  .items{display:none;padding:6px 0 8px;max-height:300px;overflow:auto}
  .grp.open .items{display:block}
  .items button{display:block;width:100%;text-align:left;border:0;background:transparent;
                padding:5px 11px;cursor:pointer;font-size:13px;color:var(--sub);
                font-family:inherit;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .items button:hover{background:#f6f2ea;color:var(--ink)}
  .items button.on{background:var(--accent);color:#fff}
  input[type=search],input[type=text],select,textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;
    font-size:13px;background:#fdfcfa;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
  textarea{min-height:130px;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.75}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
       padding:7px 15px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.88;color:#fff}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .status{margin-top:9px;font-size:12px;min-height:18px;word-break:break-all}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .iohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .iohead span{font-size:12px;color:var(--sub)}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:5px;
       padding:1px 7px;font-size:11px;margin-left:6px}
  .note{font-size:12px;color:var(--sub);margin:6px 0 0}
  .kbd{font-family:var(--mono);background:#f4f0e8;border-radius:4px;padding:0 4px;font-size:11px}
  @media(max-width:820px){.app{flex-direction:column}aside{width:auto;flex:none}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>编 码 工 具 箱</h1>
  <div class="sub">纯前端零依赖 · 断网可用 · <span id="stat"></span></div>
</header>

<div class="app">
  <aside>
    <div class="panel" style="padding:10px">
      <input type="search" id="q" placeholder="搜索算法…">
    </div>
    <div class="panel" id="nav"></div>
  </aside>

  <main>
    <div class="panel">
      <h3 id="title">请从左侧选择算法<span id="tag" class="tag" style="display:none"></span></h3>
      <div id="params"></div>
      <div class="note" id="desc"></div>
    </div>

    <div class="panel">
      <div class="iohead"><span>输入</span><span id="inlen"></span></div>
      <textarea id="in" placeholder="在此输入文本…"></textarea>
      <div class="row" style="margin:10px 0">
        <button class="btn primary" id="bEnc">编码 / 计算 →</button>
        <button class="btn" id="bDec">← 解码</button>
        <button class="btn" id="bSwap">上下互换</button>
        <button class="btn" id="bCopy">复制结果</button>
        <button class="btn" id="bClear">清空</button>
        <span class="note" style="margin:0">快捷键 <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> 编码</span>
      </div>
      <div class="iohead"><span>输出</span><span id="outlen"></span></div>
      <textarea id="out" placeholder="结果…"></textarea>
      <div class="status" id="st"></div>
    </div>

    <div class="panel" id="rsaPanel" style="display:none">
      <h3>RSA 工具箱</h3>
      <div class="grid3">
        <div class="field"><label>密钥位数</label>
          <select id="rsaBits"><option>512</option><option selected>1024</option><option>2048</option></select></div>
        <div class="field"><label>公钥指数 e</label><input type="text" id="rsaE" value="65537"></div>
        <div class="field"><label>填充 / 模式</label>
          <select id="rsaPad">
            <option>PKCS1v15</option><option>OAEP-SHA1</option><option>OAEP-SHA256</option><option>Raw</option>
          </select></div>
      </div>
      <div class="row" style="margin-bottom:9px">
        <button class="btn primary" id="rsaGen">生成密钥对</button>
        <button class="btn" id="rsaParse">载入密钥</button>
        <button class="btn" id="rsaShow">导出 PEM</button>
        <button class="btn" id="rsaFactor">分解模数 n</button>
      </div>
      <div class="field"><label>密钥（PEM，或 {n,e,d} JSON；生成后自动填入）</label>
        <textarea id="rsaKey" style="min-height:80px"></textarea></div>
      <div class="row">
        <button class="btn" id="rsaEnc">公钥加密</button>
        <button class="btn" id="rsaDec">私钥解密</button>
        <button class="btn" id="rsaSign">私钥签名</button>
        <button class="btn" id="rsaVer">公钥验签</button>
      </div>
      <div class="field" style="margin-top:9px"><label>签名 / 验签用原文（留空则取「输入」框）</label>
        <textarea id="rsaMsg" style="min-height:60px"></textarea></div>
      <div class="note">加解密走「输入 / 输出」框：加密结果以 HEX 输出，解密时把 HEX 粘进「输入」框。
        签名结果放进「输出」框，验签时把签名 HEX 粘进「输入」框。</div>
    </div>
  </main>
</div>

<script>
/* CodeToolBox 内核（零依赖，纯 JS） */
(function () {
var CT = {};
/* ===== 01-core.js ===== */
/* ===========================================================================
 * 编码工具箱 · 基础层
 *   CT.util  —— 字节 / 十六进制 / Base64 / 字符集 / 校验和
 *   CT.hash  —— 哈希算法族（含国密 SM3、SHA-3/Keccak、RIPEMD-160）
 * 零依赖。所有函数输入输出均为 Uint8Array 或字符串（除非注明）。
 * =========================================================================== */

CT.util = (function () {
  const HEX_L = '0123456789abcdef';
  const HEX_U = '0123456789ABCDEF';

  /* ---------- 字符串 <-> 字节 ---------- */

  function utf8Enc(str) {
    // 手写 UTF-8 编码：不依赖 TextEncoder，保证 file:// 与旧引擎一致
    const out = [];
    for (let i = 0; i < str.length; i++) {
      let c = str.charCodeAt(i);
      // 处理代理对（emoji 等）
      if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        const d = str.charCodeAt(i + 1);
        if (d >= 0xdc00 && d <= 0xdfff) {
          c = 0x10000 + ((c - 0xd800) << 10) + (d - 0xdc00);
          i++;
        }
      }
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      else if (c < 0x10000) out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
      else out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 0x3f), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
    }
    return Uint8Array.from(out);
  }

  function utf8Dec(b, fatal) {
    let s = '';
    for (let i = 0; i < b.length; ) {
      const c = b[i++];
      let cp;
      if (c < 0x80) cp = c;
      else if (c >= 0xc0 && c < 0xe0) cp = ((c & 0x1f) << 6) | (b[i++] & 0x3f);
      else if (c >= 0xe0 && c < 0xf0) cp = ((c & 0x0f) << 12) | ((b[i++] & 0x3f) << 6) | (b[i++] & 0x3f);
      else if (c >= 0xf0) cp = ((c & 0x07) << 18) | ((b[i++] & 0x3f) << 12) | ((b[i++] & 0x3f) << 6) | (b[i++] & 0x3f);
      else { if (fatal) throw new Error('UTF-8 字节序列非法'); cp = 0xfffd; }
      if (cp > 0xffff) {
        cp -= 0x10000;
        s += String.fromCharCode(0xd800 + (cp >> 10), 0xdc00 + (cp & 0x3ff));
      } else s += String.fromCharCode(cp);
    }
    return s;
  }

  function utf16leEnc(str) {
    const o = new Uint8Array(str.length * 2);
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      o[i * 2] = c & 0xff; o[i * 2 + 1] = c >> 8;
    }
    return o;
  }
  function utf16beEnc(str) {
    const o = new Uint8Array(str.length * 2);
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      o[i * 2 + 1] = c & 0xff; o[i * 2] = c >> 8;
    }
    return o;
  }
  function utf16leDec(b) {
    let s = '';
    for (let i = 0; i + 1 < b.length; i += 2) s += String.fromCharCode(b[i] | (b[i + 1] << 8));
    return s;
  }
  function utf16beDec(b) {
    let s = '';
    for (let i = 0; i + 1 < b.length; i += 2) s += String.fromCharCode((b[i] << 8) | b[i + 1]);
    return s;
  }

  function latin1Enc(str) {
    const o = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) o[i] = str.charCodeAt(i) & 0xff;
    return o;
  }
  function latin1Dec(b) {
    let s = '';
    const CH = 8192;
    for (let i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH));
    return s;
  }

  /* ---------- hex ---------- */

  function hex(b, upper) {
    const T = upper ? HEX_U : HEX_L;
    let s = '';
    for (let i = 0; i < b.length; i++) s += T[b[i] >> 4] + T[b[i] & 15];
    return s;
  }

  // 宽松解析：忽略非十六进制字符；奇数长度时末尾单字符按高位补零处理（原版直接丢弃）
  function unhex(str, keepOddTail) {
    const clean = String(str).replace(/[^0-9a-fA-F]/g, '');
    const n = keepOddTail ? Math.ceil(clean.length / 2) : (clean.length >> 1);
    const o = new Uint8Array(n);
    for (let i = 0; i < n; i++) o[i] = parseInt(clean.substr(i * 2, 2), 16);
    return o;
  }

  /* ---------- Base64（标准表，无换行） ---------- */

  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const B64_URL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

  function b64enc(b, urlSafe, pad) {
    const T = urlSafe ? B64_URL : B64;
    const usePad = pad !== false;
    let out = '';
    for (let i = 0; i < b.length; i += 3) {
      const n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0);
      const rem = b.length - i;
      out += T[(n >> 18) & 63] + T[(n >> 12) & 63];
      out += rem > 1 ? T[(n >> 6) & 63] : (usePad ? '=' : '');
      out += rem > 2 ? T[n & 63] : (usePad ? '=' : '');
    }
    return out;
  }

  function b64dec(str, urlSafe) {
    let s = String(str).replace(/[\s\r\n]/g, '');
    if (urlSafe || /[-_]/.test(s)) s = s.replace(/-/g, '+').replace(/_/g, '/');
    s = s.replace(/=+$/, '');
    const out = [];
    let acc = 0, bits = 0;
    for (let i = 0; i < s.length; i++) {
      const idx = B64.indexOf(s[i]);
      if (idx < 0) continue;
      acc = (acc << 6) | idx; bits += 6;
      if (bits >= 8) { bits -= 8; out.push((acc >> bits) & 0xff); }
    }
    return Uint8Array.from(out);
  }

  /* ---------- 杂项 ---------- */

  function concat() {
    let n = 0;
    for (let i = 0; i < arguments.length; i++) n += arguments[i].length;
    const o = new Uint8Array(n);
    let p = 0;
    for (let i = 0; i < arguments.length; i++) { o.set(arguments[i], p); p += arguments[i].length; }
    return o;
  }
  function equal(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function xor(a, b) {
    const o = new Uint8Array(a.length);
    for (let i = 0; i < a.length; i++) o[i] = a[i] ^ b[i % b.length];
    return o;
  }
  // 循环右移（用于各种分组密码）
  function rotl32(v, n) { return ((v << n) | (v >>> (32 - n))) >>> 0; }
  function rotr32(v, n) { return ((v >>> n) | (v << (32 - n))) >>> 0; }
  function rotl64(v, n) {
    n = BigInt(n) & 63n;
    return ((v << n) | (v >> (64n - n))) & 0xffffffffffffffffn;
  }
  function rotr64(v, n) {
    n = BigInt(n) & 63n;
    return ((v >> n) | (v << (64n - n))) & 0xffffffffffffffffn;
  }
  function toU32(x) { return Number(x & 0xffffffffn) >>> 0; }
  function fromU32(x) { return BigInt(x >>> 0); }

  function readBE(b) { let v = 0n; for (let i = 0; i < b.length; i++) v = (v << 8n) | BigInt(b[i]); return v; }
  function writeBE(v, len) {
    const o = new Uint8Array(len);
    for (let i = len - 1; i >= 0; i--) { o[i] = Number(v & 0xffn); v >>= 8n; }
    return o;
  }
  function packU32BE(v) {
    return Uint8Array.of((v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff);
  }
  function packU32LE(v) {
    return Uint8Array.of(v & 0xff, (v >>> 8) & 0xff, (v >>> 16) & 0xff, (v >>> 24) & 0xff);
  }

  // 把任意输入统一成字节
  function asBytes(x) {
    if (x instanceof Uint8Array) return x;
    if (Array.isArray(x)) return Uint8Array.from(x);
    if (typeof x === 'string') return utf8Enc(x);
    if (x && typeof x.length === 'number') return Uint8Array.from(x);
    throw new Error('无法转换为字节数组');
  }

  /* ---------- 校验和 ---------- */

  // CRC-32 / IEEE 802.3（与原版 java.util.zip.CRC32 一致）
  const CRC32_T = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(b, seed) {
    let c = (seed === undefined ? 0 : seed) ^ 0xffffffff;
    for (let i = 0; i < b.length; i++) c = CRC32_T[(c ^ b[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  // CRC-32C / Castagnoli（iSCSI、ext4）
  const CRC32C_T = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0x82f63b78 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32c(b) {
    let c = 0xffffffff;
    for (let i = 0; i < b.length; i++) c = CRC32C_T[(c ^ b[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  // CRC-16 常见变体
  function crc16(b, poly, init, refin, refout, xorout) {
    let crc = init;
    if (refin) {
      for (let i = 0; i < b.length; i++) {
        crc ^= b[i];
        for (let k = 0; k < 8; k++) crc = (crc & 1) ? ((crc >>> 1) ^ poly) : (crc >>> 1);
      }
    } else {
      for (let i = 0; i < b.length; i++) {
        crc ^= b[i] << 8;
        for (let k = 0; k < 8; k++) crc = (crc & 0x8000) ? (((crc << 1) ^ poly) & 0xffff) : ((crc << 1) & 0xffff);
      }
    }
    if (refout !== refin) crc = reverse16(crc);
    return (crc ^ xorout) & 0xffff;
  }
  function reverse16(v) { let r = 0; for (let i = 0; i < 16; i++) { r = (r << 1) | (v & 1); v >>= 1; } return r & 0xffff; }

  const CRC16_VARIANTS = {
    'CRC-16/ARC':      { poly: 0xa001, init: 0x0000, refin: true,  refout: true,  xorout: 0x0000 },
    'CRC-16/CCITT':    { poly: 0x1021, init: 0x0000, refin: false, refout: false, xorout: 0x0000 },
    'CRC-16/XMODEM':   { poly: 0x1021, init: 0x0000, refin: false, refout: false, xorout: 0x0000 },
    'CRC-16/MODBUS':   { poly: 0xa001, init: 0xffff, refin: true,  refout: true,  xorout: 0x0000 },
    'CRC-16/USB':      { poly: 0xa001, init: 0xffff, refin: true,  refout: true,  xorout: 0xffff },
    'CRC-16/X-25':     { poly: 0x8408, init: 0xffff, refin: true,  refout: true,  xorout: 0xffff },
    'CRC-16/DNP':      { poly: 0xa6bc, init: 0x0000, refin: true,  refout: true,  xorout: 0xffff }
  };

  // Adler-32（与原版 java.util.zip.Adler32 一致）
  function adler32(b) {
    let a = 1, s = 0;
    for (let i = 0; i < b.length; i++) {
      a += b[i];
      s += a;
      if ((i & 0xfff) === 0xfff) { a %= 65521; s %= 65521; }
    }
    return (((s % 65521) << 16) | (a % 65521)) >>> 0;
  }

  return {
    utf8Enc, utf8Dec, utf16leEnc, utf16beEnc, utf16leDec, utf16beDec,
    latin1Enc, latin1Dec,
    hex, unhex, b64enc, b64dec, B64, B64_URL,
    concat, equal, xor, asBytes,
    rotl32, rotr32, rotl64, rotr64, toU32, fromU32,
    readBE, writeBE, packU32BE, packU32LE,
    crc32, crc32c, crc16, CRC16_VARIANTS, adler32
  };
})();


CT.hash = (function () {
  const U = CT.util;

  /* ======================= 工具：整数立方根 → 常量 ======================= */

  function primes(n) {
    const out = [];
    for (let x = 2; out.length < n; x++) {
      let ok = true;
      for (let i = 0; i < out.length && out[i] * out[i] <= x; i++) if (x % out[i] === 0) { ok = false; break; }
      if (ok) out.push(x);
    }
    return out;
  }

  function icbrt(n) {
    if (n < 2n) return n;
    let x = 1n << BigInt(Math.ceil(n.toString(2).length / 3) + 1);
    for (;;) {
      const y = (2n * x + n / (x * x)) / 3n;
      if (y >= x) return x;
      x = y;
    }
  }

  // K[i] = floor(frac(cbrt(p_i)) * 2^bits)  —— SHA-2 标准常量，精确整数推导
  function cubeFracConstants(count, bits) {
    const out = [];
    const scale = 1n << BigInt(bits * 3);
    for (const p of primes(count)) {
      const c = icbrt(BigInt(p) * scale);
      out.push(c & ((1n << BigInt(bits)) - 1n));
    }
    return out;
  }

  // H0 = floor(frac(sqrt(p_i)) * 2^bits)
  function sqrtFracConstants(count, bits) {
    const out = [];
    const scale = 1n << BigInt(bits * 2);
    for (const p of primes(count)) {
      let x = 1n << BigInt(Math.ceil((BigInt(p) * scale).toString(2).length / 2) + 1);

    'SHA-512/224':  { fn: sha512_224, out: 28, kind: 'hash' },
    'SHA-512/256':  { fn: sha512_256, out: 32, kind: 'hash' },

    'BLAKE2b-384':  { fn: d => blake2b(d, 48), out: 48, kind: 'hash' },
    'BLAKE2b-256':  { fn: d => blake2b(d, 32), out: 32, kind: 'hash' },
    'BLAKE2b-128':  { fn: d => blake2b(d, 16), out: 16, kind: 'hash' },
    'FNV1a-32':     { fn: d => wr32be(fnv1a32(d)), out: 4, kind: 'fast' },
    'FNV1-32':      { fn: d => wr32be(fnv132(d)),  out: 4, kind: 'fast' },
    'FNV1a-64':     { fn: d => wr64be(fnv1a64(d)), out: 8, kind: 'fast' },
    'FNV1-64':      { fn: d => wr64be(fnv164(d)),  out: 8, kind: 'fast' },
    'xxHash32':     { fn: d => wr32be(xxh32(d)),   out: 4, kind: 'fast' },

    blake2s, blake2b,
    fnv1a32, fnv132, fnv1a64, fnv164,
    xxh32, xxh64,
    murmur3_32, murmur3_128,
    crc8, crc8maxim, crc64xz, crc64ecma,

    hex(name, data) {
      const m = MAP[name] || CT.hash.ALGOS[name];

/* ===========================================================================

    let out = '';
    for (const b of bytes) {
      out += TRIGRAM[(b >> 6) & 7] + TRIGRAM[(b >> 3) & 7] + TRIGRAM[b & 7];
    }
    return out;
  }
  function baguaDecode(s) {
    const src = String(s);
    const idx = [];
    for (const ch of src) {
      const i = TRIGRAM.indexOf(ch);
      if (i >= 0) idx.push(i);
      else {
        const j = TRIGRAM_NAME.indexOf(ch);
        if (j >= 0) idx.push(j);
      }
    }
    const full = idx.slice(0, idx.length - (idx.length % 3));
    const bytes = [];
    for (let i = 0; i < full.length; i += 3) {
      bytes.push(((full[i] << 6) | (full[i + 1] << 3) | full[i + 2]) & 0xff);
    }
    return U.utf8Dec(Uint8Array.from(bytes), true);
  }

  /** 六十四卦：UTF-8 字节流按 6 bit 分组 → 卦符 */
  function hexagramEncode(text) {
    const bytes = U.utf8Enc(String(text));
    let bits = '';
    for (const b of bytes) bits += b.toString(2).padStart(8, '0');
    const padLen = (6 - (bits.length % 6)) % 6;
    bits += '0'.repeat(padLen);
    let out = '';
    for (let i = 0; i < bits.length; i += 6) out += hexagramChar(parseInt(bits.slice(i, i + 6), 2));
    return out + (padLen ? ' ' + padLen : '');     // 末尾附上补位数
  }
  function hexagramDecode(s) {
    const src = String(s).trim();
    let padLen = 0;
    const m = /\s([0-5])$/.exec(src);
    let body = src;
    if (m) { padLen = +m[1]; body = src.slice(0, m.index); }
    let bits = '';
    for (const ch of body) {
      const cp = ch.codePointAt(0);
      if (cp >= 0x4dc0 && cp <= 0x4dff) bits += (cp - 0x4dc0).toString(2).padStart(6, '0');
    }
    if (padLen) bits = bits.slice(0, bits.length - padLen);
    bits = bits.slice(0, bits.length - (bits.length % 8));
    const bytes = [];
    for (let i = 0; i < bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
    return U.utf8Dec(Uint8Array.from(bytes), true);
  }

  /* =============== 6. 嗷呜（兽语） =============== */
  //  约定：按位编码，0 → 嗷，1 → 呜，字节之间用空格分隔（便于阅读）
  const BEAST0 = '嗷';
  const BEAST1 = '呜';
  function beastEncode(text, options) {
    const opt = options || {};
    const bytes = U.utf8Enc(String(text));
    const words = [];
    for (const b of bytes) {
      let w = '';
      for (let k = 7; k >= 0; k--) w += (b >> k) & 1 ? BEAST1 : BEAST0;
      words.push(w);
    }
    return words.join(opt.sep === undefined ? ' ' : opt.sep);
  }
  function beastDecode(s) {
    const src = String(s);
    let bits = '';
    for (const ch of src) {
      if (ch === BEAST0) bits += '0';
      else if (ch === BEAST1) bits += '1';
    }
    bits = bits.slice(0, bits.length - (bits.length % 8));
    const bytes = [];
    for (let i = 0; i < bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
    return U.utf8Dec(Uint8Array.from(bytes), true);
  }

  /* =============== 7. 统一入口 =============== */
  const TOOLS = {
    '核心价值观': {
      enc: (s, p) => coreValuesEncode(s, p && p.random),
      dec: s => coreValuesDecode(s),
      params: [{ k: 'random', label: '随机化 A~F 分支', type: 'bool', def: false }]
    },
    '与佛论禅': {
      enc: (s, p) => buddha.encode(s, p && p.version === 1 ? 1 : 2),
      dec: s => buddha.decode(s),
      params: [{ k: 'version', label: '1=佛曰 2=如是我闻', type: 'int', def: 2 }]
    },
    '文本转Ook': {
      enc: s => textToOok(s),
      dec: s => bfRunText(ookToBf(s))
    },
    '文本转BF': {
      enc: s => bfEncode(s),
      dec: s => bfRunText(s)
    },
    '零宽隐写': {
      enc: s => zwEncode(s),
      dec: s => zwExtract(s)
    },
    '八卦': {
      enc: s => baguaEncode(s),
      dec: s => baguaDecode(s)
    },
    '六十四卦': {
      enc: s => hexagramEncode(s),
      dec: s => hexagramDecode(s)
    },
    '嗷呜兽语': {
      enc: s => beastEncode(s),
      dec: s => beastDecode(s)
    }
  };

  return {
    CV_VALUES, coreValuesEncode, coreValuesDecode,
    str2utf8, utf82str, hex2duo, duo2hex, duo2values,
    buddha,
    BF_CHARS, bfEncode, bfRun, bfRunText, bfToOok, ookToBf, textToOok,
    zwEncode, zwDecode, zwHide, zwExtract, ZW0, ZW1, ZWS, ZWHEAD,
    TRIGRAM, TRIGRAM_NAME, baguaEncode, baguaDecode, hexagramEncode, hexagramDecode,
    beastEncode, beastDecode,
    TOOLS
  };
})();


/* ===== 08-misc.js ===== */
/* ===========================================================================
 * 编码工具箱 · 实用工具层
 *   CT.misc ——
 *     转义类：URL、HTML 实体、Unicode 转义（\uXXXX / \u{XXXXX} / %uXXXX / U+XXXX）、
 *             Quoted-Printable、C 风格字符串转义
 *     进制类：任意 2~36 进制互转（BigInt）、文本 ↔ 二进制/八进制/十进制
 *     生成类：UUID（v1/v4/nil）、随机密码/随机串、时间戳
 *     文本类：统计、大小写、命名风格、行操作、反转、去重排序
 *     识别类：编码类型自动嗅探
 * =========================================================================== */

CT.misc = (function () {
  const U = CT.util;

  /* ======================= 随机源 ======================= */
  function randBytes(n) {
    const out = new Uint8Array(n);
    const g = (typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.getRandomValues)
      ? globalThis.crypto : null;
    if (g) { g.getRandomValues(out); return out; }
    for (let i = 0; i < n; i++) out[i] = (Math.random() * 256) | 0;
    return out;
  }

  /* ======================= URL ======================= */
  const urlEncodeComponent = s => encodeURIComponent(String(s));
  const urlDecodeComponent = s => decodeURIComponent(String(s));
  const urlEncodeFull = s => encodeURI(String(s));
  const urlDecodeFull = s => decodeURI(String(s));
  /** 保留 + 号语义的 www-form 变体 */
  const formEncode = s => encodeURIComponent(String(s)).replace(/%20/g, '+');
  const formDecode = s => decodeURIComponent(String(s).replace(/\+/g, ' '));

  /* ======================= HTML 实体 ======================= */
  function htmlEncode(s, all) {
    const t = String(s);
    if (all) {
      let out = '';
      for (const ch of t) out += '&#' + ch.codePointAt(0) + ';';
      return out;
    }
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', ' ': '&nbsp;' };
    return t.replace(/[&<>"' ]/g, c => map[c]);
  }
  function htmlDecode(s) {
    return String(s)
      .replace(/&#x([0-9a-fA-F]+);/g, (m, h) => String.fromCodePoint(parseInt(h, 16)))
      .replace(/&#(\d+);/g, (m, d) => String.fromCodePoint(parseInt(d, 10)))
      .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&apos;/g, "'")
      .replace(/&amp;/g, '&');
  }

  /* ======================= Unicode / 转义 ======================= */
  const escUnicode = s => Array.from(String(s)).map(c => {
    const cp = c.codePointAt(0);
    return cp <= 0xffff ? '\\u' + cp.toString(16).padStart(4, '0') : '\\u{' + cp.toString(16) + '}';
  }).join('');
  const unescUnicode = s => String(s)
    .replace(/\\u\{([0-9a-fA-F]+)\}/g, (m, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/\\u([0-9a-fA-F]{4})/g, (m, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/%u([0-9a-fA-F]{4})/g, (m, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/(?:U\+|u\+)([0-9a-fA-F]{4,6})/g, (m, h) => String.fromCodePoint(parseInt(h, 16)));
  const escC = s => String(s)
    .replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t').replace(/"/g, '\\"').replace(/'/g, "\\'")
    .replace(/[\u0000-\u001f\u007f]/g, c => '\\x' + c.charCodeAt(0).toString(16).padStart(2, '0'));
  const unescC = s => String(s).replace(/\\(x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|.)/g, (m, e) => {
    if (e[0] === 'x') return String.fromCharCode(parseInt(e.slice(1), 16));
    if (e[0] === 'u') return String.fromCharCode(parseInt(e.slice(1), 16));
    return { n: '\n', r: '\r', t: '\t', '0': '\0', b: '\b', f: '\f', v: '\v' }[e] || e;
  });

  /** Quoted-Printable（RFC 2045；换行统一用 \n，软换行在解码时会去掉） */
  function qpEncode(s, softBreak) {
    const bytes = U.utf8Enc(String(s));
    const limit = softBreak || 76;
    let out = '', lineLen = 0;
    const push = tok => {
      if (lineLen + tok.length > limit) { out += '=\n'; lineLen = 0; }
      out += tok; lineLen += tok.length;
    };
    for (const b of bytes) {
      if (b === 0x0a) { out += '\n'; lineLen = 0; continue; }
      const printable = (b >= 0x21 && b <= 0x7e && b !== 0x3d) || b === 0x20 || b === 0x09;
      if (printable) push(String.fromCharCode(b));
      else push('=' + b.toString(16).toUpperCase().padStart(2, '0'));
    }
    return out;
  }
  function qpDecode(s) {
    const t = String(s).replace(/=\r?\n/g, '').replace(/=([0-9a-fA-F]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
    return U.utf8Dec(U.latin1Enc(t), true);
  }

  /* ======================= 进制 ======================= */
  const DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz';

  function bigFromString(str, base) {
    const s = String(str).trim().toLowerCase().replace(/[\s_,]/g, '');
    if (!s) throw new Error('空字符串无法解析');
    let neg = false, t = s;
    if (t[0] === '-') { neg = true; t = t.slice(1); }
    if (t.slice(0, 2) === '0x' && base === 16) t = t.slice(2);
    if (!t.length) throw new Error('缺少数字位');
    let v = 0n;
    for (const ch of t) {
      const d = DIGITS.indexOf(ch);
      if (d < 0 || d >= base) throw new Error(`字符「${ch}」不是 ${base} 进制的合法数字`);
      v = v * BigInt(base) + BigInt(d);
    }
    return neg ? -v : v;
  }
  function bigToString(v, base, upper) {
    const neg = v < 0n;
    let x = neg ? -v : v;
    const B = BigInt(base);
    if (x === 0n) return '0';
    let out = '';
    while (x > 0n) { out = DIGITS[Number(x % B)] + out; x /= B; }
    if (upper) out = out.toUpperCase();
    return (neg ? '-' : '') + out;
  }
  /** 任意进制互转 */
  function convertBase(str, from, to, upper) {
    return bigToString(bigFromString(str, from), to, upper);
  }

  const textToBinary = (s, sep) => [...U.utf8Enc(String(s))].map(b => b.toString(2).padStart(8, '0')).join(sep === undefined ? ' ' : sep);
  const textToOctal  = (s, sep) => [...U.utf8Enc(String(s))].map(b => b.toString(8).padStart(3, '0')).join(sep === undefined ? ' ' : sep);
  const textToDecimal = (s, sep) => [...U.utf8Enc(String(s))].map(b => String(b)).join(sep === undefined ? ' ' : sep);
  function binaryToText(s) {
    const bits = String(s).replace(/[^01]/g, '');
    const out = [];
    for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2));
    return U.utf8Dec(Uint8Array.from(out), true);
  }
  function octalToText(s) {
    const g = String(s).match(/\d{1,3}/g) || [];
    return U.utf8Dec(Uint8Array.from(g.map(x => parseInt(x, 8) & 0xff)), true);
  }
  function decimalToText(s) {
    const g = String(s).match(/\d{1,3}/g) || [];
    return U.utf8Dec(Uint8Array.from(g.map(x => parseInt(x, 10) & 0xff)), true);
  }
  /** 十进制大数 → 字节串（用于把超大整数还原成文本） */
  function bigIntToText(str) {
    let v = bigFromString(str, 10);
    if (v === 0n) return '\0';
    const bytes = [];
    while (v > 0n) { bytes.unshift(Number(v & 0xffn)); v >>= 8n; }
    return U.utf8Dec(Uint8Array.from(bytes), true);
  }

  /* ======================= 生成 ======================= */
  const hex2 = n => n.toString(16).padStart(2, '0');

  function uuidV4() {
    const b = randBytes(16);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = U.hex(b, false);
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  function uuidV1() {
    // 100 纳秒间隔从 1582-10-15 起算
    const GREG = 122192928000000000n;
    const now = BigInt(Date.now()) * 10000n + GREG;
    const timeLow = now & 0xffffffffn;
    const timeMid = (now >> 32n) & 0xffffn;
    const timeHi = ((now >> 48n) & 0x0fffn) | 0x1000n;
    const clockSeq = ((randBytes(2)[0] & 0x3f) << 8) | randBytes(1)[0];
    const node = randBytes(6);
    const g = (x, n) => x.toString(16).padStart(n, '0');
    return `${g(timeLow, 8)}-${g(timeMid, 4)}-${g(timeHi, 4)}-${g(clockSeq, 4)}-${U.hex(node, false)}`;
  }
  const uuidNil = () => '00000000-0000-0000-0000-000000000000';

  function randomString(len, charset) {
    const cs = charset || 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    if (!cs.length) throw new Error('字符集不能为空');
    const b = randBytes(len);
    let out = '';
    for (let i = 0; i < len; i++) out += cs[b[i] % cs.length];
    return out;
  }
  const CHARSETS = {
    '数字': '0123456789',
    '小写': 'abcdefghijklmnopqrstuvwxyz',
    '大写': 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    '字母': 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',
    '字母数字': 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
    '十六进制': '0123456789abcdef',
    'Base64': 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/',
    '可打印ASCII': Array.from({ length: 94 }, (_, i) => String.fromCharCode(33 + i)).join(''),
    '密码(无易混字符)': 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+'
  };

  function timestamp(ts, unit) {
    let ms;
    if (ts === undefined || ts === '' || ts === null) ms = Date.now();
    else {
      const n = Number(ts);
      if (isNaN(n)) { const d = new Date(ts); if (isNaN(d.getTime())) throw new Error('无法解析的时间：' + ts); ms = d.getTime(); }
      else {
        const u = unit || (String(ts).replace('-', '').length >= 13 ? 'ms' : 's');
        ms = u === 'ms' ? n : n * 1000;
      }
    }
    const d = new Date(ms);
    const p = (x, n) => String(x).padStart(n || 2, '0');
    const local = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    return {
      ms, seconds: Math.floor(ms / 1000),
      local, iso: d.toISOString(),
      utc: d.toUTCString(),
      date: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`,
      time: `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
    };
  }

  /* ======================= 文本处理 ======================= */
  function stats(s) {
    const t = String(s);
    const bytes = U.utf8Enc(t);
    let cjk = 0, ascii = 0, other = 0;
    for (const ch of t) {
      const cp = ch.codePointAt(0);
      if (cp >= 0x4e00 && cp <= 0x9fff) cjk++;
      else if (cp < 128) ascii++;
      else other++;
    }
    return {
      chars: Array.from(t).length,
      bytes: bytes.length,
      lines: t === '' ? 0 : t.split(/\r\n|\r|\n/).length,
      words: (t.match(/[A-Za-z0-9_\u4e00-\u9fff]+/g) || []).length,
      cjk, ascii, other,
      hasNonAscii: bytes.some(b => b > 127)
    };
  }

  const toUpper = s => String(s).toUpperCase();
  const toLower = s => String(s).toLowerCase();
  const swapCase = s => String(s).replace(/[A-Za-z]/g, c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase());
  const reverse = s => Array.from(String(s)).reverse().join('');
  const reverseLines = s => String(s).split(/\r?\n/).reverse().join('\n');
  const sortLines = s => String(s).split(/\r?\n/).sort().join('\n');
  const uniqueLines = s => Array.from(new Set(String(s).split(/\r?\n/))).join('\n');
  const trimLines = s => String(s).split(/\r?\n/).map(x => x.trim()).join('\n');
  const removeEmptyLines = s => String(s).split(/\r?\n/).filter(x => x.trim() !== '').join('\n');
  function numberLines(s, start, sep) {
    const st = start || 1, sp = sep === undefined ? '. ' : sep;
    return String(s).split(/\r?\n/).map((x, i) => (st + i) + sp + x).join('\n');
  }
  function stripNumbering(s) {
    return String(s).split(/\r?\n/).map(x => x.replace(/^\s*\d+\s*[.、:)\]]?\s*/, '')).join('\n');
  }
  const removeWhitespace = s => String(s).replace(/\s+/g, '');
  const collapseSpaces = s => String(s).replace(/[ \t]+/g, ' ').trim();
  /** 命名风格转换 */
  function toNaming(s, style) {
    const words = String(s)
      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .replace(/[_\-.\s]+/g, ' ')
      .trim().toLowerCase().split(/\s+/).filter(Boolean);
    const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
    switch (style) {
      case 'camel': return words.map((w, i) => i ? cap(w) : w).join('');
      case 'pascal': return words.map(cap).join('');
      case 'snake': return words.join('_');
      case 'constant': return words.join('_').toUpperCase();
      case 'kebab': return words.join('-');
      case 'dot': return words.join('.');
      case 'title': return words.map(cap).join(' ');
      case 'upper': return words.join(' ').toUpperCase();
      default: return words.join(' ');
    }
  }

  /* ======================= 编码嗅探 ======================= */
  function detect(text) {
    const t = String(text).trim();
    const hits = [];
    const add = (name, conf, note) => hits.push({ name, conf, note: note || '' });

    if (!t) return hits;

    // 中文趣味
    if (/[富强民主文明和谐自由平等公正法治爱国敬业诚信友善]{4,}/.test(t) &&
        [...t].every(c => CT.cncode.CV_VALUES.includes(c) || /\s/.test(c))) add('核心价值观', 0.95);
    if (/^佛曰[:：]/.test(t)) add('与佛论禅 V1（佛曰）', 0.99);
    if (/^如是我闻[:：]/.test(t)) add('与佛论禅 V2（如是我闻）', 0.99);
    if (/^[\u200b\u200c\u200d\ufeff]+$/.test(t)) add('零宽字符隐写', 0.99);
    if (/^[嗷呜\s]+$/.test(t) && /[嗷呜]/.test(t)) add('嗷呜（兽语）', 0.9);
    if (/^[☰☱☲☳☴☵☶☷\s]+$/.test(t)) add('八卦', 0.95);
    if (/^[\u4dc0-\u4dff\s0-5]+$/.test(t) && /[\u4dc0-\u4dff]/.test(t)) add('六十四卦', 0.95);
    if (/^(Ook[.!?]\s*)+$/.test(t)) add('Ook!', 0.99);
    if (/^[><+\-.,\[\]\s]+$/.test(t) && /[<>+\-.,\[\]]/.test(t)) add('Brainfuck', 0.8);
    if (/^[┌┬┐├┼┤└┴┘◤◥◣◢\u0323\s]+$/.test(t)) add('猪圈密码', 0.9);
    if (/^[.\-/\s]+$/.test(t) && /[.-]/.test(t)) add('摩斯电码', 0.85);
    if (/^\s*(?:\d{1,2}[\s\-]+){3,}\d{1,2}\s*$/.test(t)) add('A1Z26 / 数字串', 0.6);
    if (/^[ABab\s]{10,}$/.test(t)) add('培根密码', 0.7);
    if (/^[\d\s]{10,}$/.test(t) && /[12]\d?\s/.test(t)) add('Polybius 坐标', 0.4);

    // 通用编码
    if (/^[0-9a-fA-F\s]+$/.test(t) && t.replace(/\s/g, '').length % 2 === 0 && t.replace(/\s/g, '').length >= 4)
      add('十六进制', 0.85);
    if (/^[01\s]+$/.test(t) && t.replace(/\s/g, '').length >= 8 && t.replace(/\s/g, '').length % 8 === 0)
      add('二进制', 0.9);
    if (/^[0-7\s]+$/.test(t) && t.replace(/\s/g,'').length >= 3 && t.replace(/\s/g,'').length % 3 === 0)

        let n = 0;
        for (let k = 0; k < 4; k++) {
          // 兼容两种「0」写法：空格(32) 与反引号(96)，两者 (c-32)&63 均为 0
          const c = line.charCodeAt(j + k);
          n = (n << 6) | (isNaN(c) ? 0 : ((c - 32) & 63));
        }
        const take = Math.min(3, rem);
        if (take >= 1) out.push((n >> 16) & 255);
        if (take >= 2) out.push((n >> 8) & 255);
        if (take >= 3) out.push(n & 255);
        rem -= take;
      }
    }
    return Uint8Array.from(out);
  }

  /* =================== 2. XXencode =================== */
  // 字母表：+ - 0-9 A-Z a-z，长度字符也取自该表
  const XX_A = '+-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

  function xxEncode(bytes) {
    const b = U.asBytes(bytes);
    const out = [];
    for (let i = 0; i < b.length; i += 45) {
      const len = Math.min(45, b.length - i);
      out.push(XX_A[len]);
      for (let j = 0; j < len; j += 3) {
        const n = (b[i + j] << 16) | ((b[i + j + 1] || 0) << 8) | (b[i + j + 2] || 0);
        const take = Math.min(3, len - j) + 1;      // XX 只输出 (字节数+1) 个字符
        for (let k = 0; k < take; k++) out.push(XX_A[(n >> (18 - 6 * k)) & 63]);
      }
      out.push('\n');
    }
    return out.join('');
  }

  function xxDecode(str) {
    const out = [];
    const lines = String(str).split(/\r?\n/);
    for (const line of lines) {
      if (!line.length) continue;
      const rest = line.slice(1);
      for (let j = 0; j < rest.length; j += 4) {
        const grp = rest.substr(j, 4);
        if (grp.length < 2) break;
        let n = 0;
        for (let k = 0; k < 4; k++) {
          const v = k < grp.length ? XX_A.indexOf(grp[k]) : 0;
          if (v < 0) throw new Error('非法 XXencode 字符: ' + grp[k]);
          n = (n << 6) | v;
        }
        const take = grp.length - 1;
        if (take >= 1) out.push((n >> 16) & 255);
        if (take >= 2) out.push((n >> 8) & 255);
        if (take >= 3) out.push(n & 255);
      }
    }
    return Uint8Array.from(out);
  }

  /* =================== 3. Ascii85（含 Adobe 变体） =================== */

  function a85Encode(bytes, opts) {
    opts = opts || {};
    const b = U.asBytes(bytes);
    const adobe = !!opts.adobe, fold = !!opts.foldspaces;
    const out = [];
    for (let i = 0; i < b.length; i += 4) {
      const n = Math.min(4, b.length - i);        // 本组实际字节数（1..4）
      if (n === 4 && b[i] === 0 && b[i + 1] === 0 && b[i + 2] === 0 && b[i + 3] === 0) {
        out.push('z'); continue;
      }
      if (fold && n === 4 && b[i] === 32 && b[i + 1] === 32 && b[i + 2] === 32 && b[i + 3] === 32) {
        out.push('y'); continue;
      }
      // 用乘法而非 v<<8：JS 位运算是 32 位有符号，字节值大时会溢出成负数
      let v = 0;
      for (let k = 0; k < 4; k++) v = v * 256 + (k < n ? b[i + k] : 0);
      const c = [];
      for (let k = 4; k >= 0; k--) { c[k] = v % 85; v = Math.floor(v / 85); }
      for (let k = 0; k < n + 1; k++) out.push(String.fromCharCode(33 + c[k]));
    }
    const body = out.join('');
    return adobe ? '<~' + body + '~>' : body;
  }

  function a85Decode(str, opts) {
    opts = opts || {};
    let s = String(str).trim();
    if (s.startsWith('<~')) s = s.slice(2);
    if (s.endsWith('~>')) s = s.slice(0, -2);
    s = s.replace(/\s+/g, '');
    const out = [];
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === 'z') { out.push(0, 0, 0, 0); continue; }
      if (c === 'y') { out.push(32, 32, 32, 32); continue; }
      const grp = s.substr(i, 5);
      if (grp.length < 2) throw new Error('Ascii85 尾部不完整');
      let v = 0;
      for (let k = 0; k < 5; k++) {
        const code = k < grp.length ? grp.charCodeAt(k) - 33 : 0;
        if (code < 0 || code > 84) throw new Error('非法 Ascii85 字符');
        v = v * 85 + (k < grp.length ? code : 84);
      }
      const take = grp.length - 1;
      // v 最大 85^5 ≈ 4.44e9，超过 32 位；用除法取字节，不能用 >>> 移位
      if (take >= 1) out.push(Math.floor(v / 0x1000000) & 255);
      if (take >= 2) out.push(Math.floor(v / 0x10000) & 255);
      if (take >= 3) out.push(Math.floor(v / 0x100) & 255);
      if (take >= 4) out.push(v & 255);
      i += grp.length - 1;
    }
    return Uint8Array.from(out);
  }

  /* =================== 4. Base92 =================== */
  // 13 bit -> 2 字符；剩余不足 7 bit 补到 6 bit 出 1 字符，否则补到 13 bit 出 2 字符
  const B92 = (function () {
    const a = [];
    a.push(0x21);                                   // '!'
    for (let i = 0; i < 61; i++) a.push(0x23 + i);  // '#'(35) .. '{'? (35+60=95='_')
    for (let i = 0; i < 29; i++) a.push(0x61 + i);  // 'a' .. '{'? (97+28=125='}')
    return String.fromCharCode.apply(null, a);
  })();

  function b92Encode(bytes) {
    const b = U.asBytes(bytes);
    if (!b.length) return '~';
    let buf = 0, bits = 0;
    const out = [];
    for (let i = 0; i < b.length; i++) {
      buf = (buf << 8) | b[i];
      bits += 8;
      while (bits >= 13) {
        const chunk = buf >> (bits - 13);
        buf &= (1 << (bits - 13)) - 1;
        bits -= 13;
        out.push(B92[Math.floor(chunk / 91)], B92[chunk % 91]);
      }
    }
    if (bits > 0) {
      if (bits < 7) {
        out.push(B92[buf << (6 - bits)]);
      } else {
        const chunk = buf << (13 - bits);
        out.push(B92[Math.floor(chunk / 91)], B92[chunk % 91]);
      }
    }
    return out.join('');
  }

  function b92Decode(str) {
    let s = String(str).trim();
    if (s === '~') return new Uint8Array(0);
    if (s.length === 1) throw new Error('单个字符不是合法 base92');
    let buf = 0, bits = 0;
    const out = [];
    let i = 0;
    for (; i < s.length - 1; i += 2) {
      const v1 = B92.indexOf(s[i]), v2 = B92.indexOf(s[i + 1]);
      if (v1 < 0 || v2 < 0) throw new Error('非法 base92 字符');
      const chunk = v1 * 91 + v2;
      if (chunk >= 8192) throw new Error('base92 分组超界');
      buf = (buf << 13) | chunk;
      bits += 13;
      while (bits >= 8) {
        out.push(buf >> (bits - 8));
        buf &= (1 << (bits - 8)) - 1;
        bits -= 8;
      }
    }
    if (i < s.length) {
      const v = B92.indexOf(s[i]);
      if (v < 0) throw new Error('非法 base92 字符');
      buf = (buf << 6) | v;
      bits += 6;
      while (bits >= 8) {
        out.push(buf >> (bits - 8));
        buf &= (1 << (bits - 8)) - 1;
        bits -= 8;
      }
    }
    return Uint8Array.from(out);
  }

  /* =================== 5. yEnc =================== */
  // 每字节 +42 取模；遇 0x00/0x0A/0x0D/0x3D(=) 用 '=' 转义并再 +64
  function yEncEncode(bytes, opts) {
    opts = opts || {};
    const b = U.asBytes(bytes);
    const line = opts.line || 0;      // 0 = 不折行
    const out = [];
    let col = 0;
    for (let i = 0; i < b.length; i++) {
      let v = (b[i] + 42) & 255;
      if (v === 0 || v === 0x0A || v === 0x0D || v === 0x3D) {
        out.push('=');
        v = (v + 64) & 255;
        col++;
      }
      out.push(String.fromCharCode(v));
      col++;
      if (line && col >= line) { out.push('\r\n'); col = 0; }
    }
    return out.join('');
  }

  function yEncDecode(str) {
    const s = String(str);
    const out = [];
    let esc = false;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c === 10 || c === 13) continue;
      if (esc) { out.push((c - 64 - 42) & 255); esc = false; continue; }
      if (c === 0x3D) { esc = true; continue; }
      out.push((c - 42) & 255);
    }
    return Uint8Array.from(out);
  }

  /* =================== 6. Punycode (RFC 3492) =================== */
  const PC_BASE = 36, PC_TMIN = 1, PC_TMAX = 26, PC_SKEW = 38, PC_DAMP = 700;
  const PC_INIT_N = 128, PC_INIT_BIAS = 72, PC_DELIM = '-';

  /* RFC 3492 §6：t(k, bias) = tmin if k <= bias+tmin; tmax if k >= bias+tmax; k-bias 否则 */
  function pcT(k, bias) {
    if (k <= bias + PC_TMIN) return PC_TMIN;
    if (k >= bias + PC_TMAX) return PC_TMAX;
    return k - bias;
  }

  function pcAdapt(delta, numPoints, firstTime) {
    delta = Math.floor(firstTime ? delta / PC_DAMP : delta / 2);
    delta += Math.floor(delta / numPoints);
    let k = 0;
    while (delta > ((PC_BASE - PC_TMIN) * PC_TMAX) / 2) {
      delta = Math.floor(delta / (PC_BASE - PC_TMIN));
      k += PC_BASE;
    }
    return k + Math.floor(((PC_BASE - PC_TMIN + 1) * delta) / (delta + PC_SKEW));
  }

  function pcDigitToChar(d) {
    return String.fromCharCode(d + 22 + 75 * (d < 26 ? 1 : 0));
  }

  function pcCharToDigit(c) {
    const v = c.charCodeAt(0);
    if (v >= 48 && v <= 57) return v - 22;          // '0'-'9' -> 26..35
    if (v >= 65 && v <= 90) return v - 65;          // 'A'-'Z' -> 0..25
    if (v >= 97 && v <= 122) return v - 97;         // 'a'-'z' -> 0..25
    return PC_BASE;
  }

  function punycodeEncode(str) {
    const input = Array.from(String(str), c => c.codePointAt(0));
    const out = [];
    let n = PC_INIT_N, delta = 0, bias = PC_INIT_BIAS;
    let h = 0;
    for (const c of input) if (c < 0x80) { out.push(String.fromCharCode(c)); h++; }
    const b = h;
    if (b > 0) out.push(PC_DELIM);
    while (h < input.length) {
      let m = 0x110000;
      for (const c of input) if (c >= n && c < m) m = c;
      delta += (m - n) * (h + 1);
      if (delta > 0x7FFFFFFF) throw new Error('Punycode 溢出');
      n = m;
      for (const c of input) {
        if (c < n) { delta++; if (delta > 0x7FFFFFFF) throw new Error('Punycode 溢出'); }
        if (c === n) {
          let q = delta;
          for (let k = PC_BASE; ; k += PC_BASE) {
            const t = pcT(k, bias);
            if (q < t) break;
            out.push(pcDigitToChar(t + ((q - t) % (PC_BASE - t))));
            q = Math.floor((q - t) / (PC_BASE - t));
          }
          out.push(pcDigitToChar(q));
          bias = pcAdapt(delta, h + 1, h === b);
          delta = 0;
          h++;
        }
      }
      delta++; n++;
    }
    return out.join('');
  }

  function punycodeDecode(str) {
    let s = String(str);
    let n = PC_INIT_N, bias = PC_INIT_BIAS;
    const out = [];
    const d = s.lastIndexOf(PC_DELIM);
    if (d >= 0) {
      for (let i = 0; i < d; i++) {
        if (s.charCodeAt(i) >= 0x80) throw new Error('分隔符左侧含非 ASCII 字符');
        out.push(s.charCodeAt(i));
      }
      s = s.slice(d + 1);
    }
    // 注意：RFC 的 i（这里叫 acc）跨轮次保持，不重置；oldi 用于取本轮 delta
    let idx = 0, acc = 0;
    while (idx < s.length) {
      const oldi = acc;
      let w = 1;
      for (let k = PC_BASE; ; k += PC_BASE) {
        if (idx >= s.length) throw new Error('Punycode 输入不完整');
        const digit = pcCharToDigit(s[idx++]);
        if (digit >= PC_BASE) throw new Error('非法 Punycode 字符');
        acc += digit * w;
        if (acc > 0x7FFFFFFF) throw new Error('Punycode 溢出');
        const t = pcT(k, bias);
        if (digit < t) break;
        w *= (PC_BASE - t);
      }
      const cnt = out.length + 1;
      bias = pcAdapt(acc - oldi, cnt, oldi === 0);
      n += Math.floor(acc / cnt);
      acc = acc % cnt;
      if (n >= 0xD800 && n <= 0xDFFF) throw new Error('Punycode 解出代理区码位');
      out.splice(acc, 0, n);
      acc++;
    }
    return out.map(c => {
      if (c > 0xFFFF) {
        const v = c - 0x10000;
        return String.fromCharCode(0xD800 + (v >> 10), 0xDC00 + (v & 0x3FF));
      }
      return String.fromCharCode(c);
    }).join('');
  }

  /* 域名级 IDNA：逐标签编码，便于同形字（homograph）分析 */
  function idnaEncode(host) {
    return String(host).split('.').map(lbl => {
      if (/^[\x00-\x7F]*$/.test(lbl)) return lbl;
      return 'xn--' + punycodeEncode(lbl);
    }).join('.');
  }

  function idnaDecode(host) {
    return String(host).split('.').map(lbl => {
      if (lbl.toLowerCase().startsWith('xn--')) {
        return punycodeDecode(lbl.slice(4)) || lbl;
      }
      return lbl;
    }).join('.');
  }

  /* =================== 7. EBCDIC (cp037) =================== */
  const EBCDIC_HEX =
    '00010203372d2e2f1605250b0c0d0e0f101112133c3d322618193f271c1d1e1f' +
    '405a7f7b5b6c507d4d5d5c4e6b604b61f0f1f2f3f4f5f6f7f8f97a5e4c7e6e6f' +
    '7cc1c2c3c4c5c6c7c8c9d1d2d3d4d5d6d7d8d9e2e3e4e5e6e7e8e9bae0bbb06d' +
    '79818283848586878889919293949596979899a2a3a4a5a6a7a8a9c04fd0a107' +
    '202122232415061728292a2b2c090a1b30311a333435360838393a3b04143eff' +
    '41aa4ab19fb26ab5bdb49a8a5fcaafbc908feafabea0b6b39dda9b8bb7b8b9ab' +
    '6465626663679e687471727378757677ac69edeeebefecbf80fdfefbfcadae59' +
    '4445424643479c4854515253585556578c49cdcecbcfcce170dddedbdc8d8edf';
  const E2A = U.unhex(EBCDIC_HEX);                 // latin1 -> EBCDIC
  const A2E = (function () {
    const t = new Uint8Array(256);
    for (let i = 0; i < 256; i++) t[E2A[i]] = i;
    return t;
  })();

  function ebcdicEncode(text) {
    const b = U.latin1Enc(String(text));
    const o = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) o[i] = E2A[b[i]];
    return U.latin1Dec(o);
  }

  function ebcdicDecode(text) {
    const b = U.latin1Enc(String(text));
    const o = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) o[i] = A2E[b[i]];
    return U.latin1Dec(o);
  }

  /* =================== 8. hexdump =================== */

  function hexdump(bytes, opts) {
    opts = opts || {};
    const b = U.asBytes(bytes);
    const w = opts.width || 16;
    const lines = [];
    for (let i = 0; i < b.length; i += w) {
      const ch = b.subarray(i, i + w);
      // 与 Python 参考一致：hex 栏右填充到 w*3-1 列，再两空格接 |ASCII|
      let hexPart = Array.prototype.map.call(ch, x => ('0' + x.toString(16)).slice(-2)).join(' ');
      while (hexPart.length < w * 3 - 1) hexPart += ' ';
      let asc = '';
      for (let k = 0; k < ch.length; k++) asc += (ch[k] >= 32 && ch[k] < 127) ? String.fromCharCode(ch[k]) : '.';
      lines.push(i.toString(16).padStart(8, '0') + '  ' + hexPart + '  |' + asc + '|');
    }
    return lines.join('\n');
  }

  function hexdumpReverse(text) {
    const out = [];
    for (const raw of String(text).split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) continue;
      let rest = line;
      const bar = rest.indexOf('|');
      if (bar >= 0) rest = rest.slice(0, bar);
      // 去掉行首偏移字段（形如 "00000000  " 或 "0000: "），要求偏移后跟 2 个以上空格
      rest = rest.replace(/^[0-9a-fA-F]{4,}:?\s{2,}/, '');
      for (const tok of rest.split(/\s+/)) {
        if (/^[0-9a-fA-F]{2}$/.test(tok)) out.push(parseInt(tok, 16));
      }
    }
    return Uint8Array.from(out);
  }

  /* 兼容无偏移、无 ASCII 栏的纯 hex 文本 */
  function hexdumpReverseLoose(text) {
    const t = String(text);
    try { return hexdumpReverse(t); } catch (e) { /* fallthrough */ }
    return U.unhex(t);
  }

  /* =================== 9. 盲文 (Braille, U+2800 区) =================== */
  // 点位：dot1=1 dot2=2 dot3=4 dot4=8 dot5=16 dot6=32（Unicode 顺序）
  const BRAILLE = {
    'a': 0x01, 'b': 0x03, 'c': 0x09, 'd': 0x19, 'e': 0x11, 'f': 0x0B,
    'g': 0x1B, 'h': 0x13, 'i': 0x0A, 'j': 0x1A, 'k': 0x05, 'l': 0x07,
    'm': 0x0D, 'n': 0x1D, 'o': 0x15, 'p': 0x0F, 'q': 0x1F, 'r': 0x17,
    's': 0x0E, 't': 0x1E, 'u': 0x25, 'v': 0x27, 'w': 0x3A, 'x': 0x2D,
    'y': 0x3D, 'z': 0x35, ' ': 0x00,
    ',': 0x02, ';': 0x06, ':': 0x12, '.': 0x32, '!': 0x16, '?': 0x26,
    '-': 0x24, "'": 0x04
  };
  const BRAILLE_INV = (function () {
    const m = {};
    for (const k in BRAILLE) if (!(BRAILLE[k] in m)) m[BRAILLE[k]] = k;
    return m;
  })();

  function brailleEncode(text) {
    // 表外字符（含 CJK、控制符）统一映射为空白盲符 U+2800，与 Python 参考一致
    let out = '';
    for (const ch of String(text)) {
      const v = BRAILLE[ch.toLowerCase()];
      out += String.fromCharCode(0x2800 + (v === undefined ? 0 : v));
    }
    return out;
  }

  function brailleDecode(text) {
    let out = '';
    for (const ch of String(text)) {
      const cp = ch.codePointAt(0);
      if (cp >= 0x2800 && cp < 0x2900) {
        const v = cp & 0xFF;
        out += (v in BRAILLE_INV) ? BRAILLE_INV[v] : '?';
      } else out += ch;
    }
    return out;
  }

  /* =================== 10. DNA 编码 =================== */
  // 2 bit -> 碱基：00=A 01=T 10=C 11=G
  const DNA_F = { '00': 'A', '01': 'T', '10': 'C', '11': 'G' };
  const DNA_R = { 'A': '00', 'T': '01', 'C': '10', 'G': '11' };

  function dnaEncode(bytes) {
    const b = U.asBytes(bytes);
    let out = '';
    for (let i = 0; i < b.length; i++) {
      const s = b[i].toString(2).padStart(8, '0');
      for (let k = 0; k < 8; k += 2) out += DNA_F[s.substr(k, 2)];
    }
    return out;
  }

  function dnaDecode(text) {
    const s = String(text).toUpperCase().replace(/[^ATCG]/g, '');
    const out = [];
    // 1 字节 = 8 bit = 4 个碱基（每碱基 2 bit）
    for (let i = 0; i + 4 <= s.length; i += 4) {
      let bits = '';
      for (let k = 0; k < 4; k++) bits += DNA_R[s[i + k]];
      out.push(parseInt(bits, 2));
    }
    return Uint8Array.from(out);
  }

  /* =================== 11. Bubble Babble =================== */
  // 源自 OpenSSH sshkey.c / Digest::BubbleBabble；输出形如 xesef-disof-...-baxux
  const BB_V = 'aeiouy';
  const BB_C = 'bcdfghklmnprstvzx';   // 索引 16 = 'x'，用作末尾哨音

  function bubbleBabble(bytes) {
    const b = U.asBytes(bytes);
    const rounds = Math.floor(b.length / 2) + 1;
    let seed = 1, out = 'x';
    for (let i = 0; i < rounds; i++) {
      const p = 2 * i;
      let a, bb, c;
      if (p < b.length) {
        const x = b[p];
        a = (((x >> 6) & 3) + seed) % 6;
        bb = (x >> 2) & 15;
        c = ((x & 3) + Math.floor(seed / 6)) % 6;
      } else {
        a = seed % 6; bb = 16; c = Math.floor(seed / 6);
      }
      out += BB_V[a] + BB_C[bb] + BB_V[c];
      if (p + 1 < b.length) {
        const y = b[p + 1];
        out += BB_C[(y >> 4) & 15] + '-' + BB_C[y & 15];
        seed = (seed * 5 + b[p] * 7 + y) % 36;
      }
    }
    return out + 'x';
  }

  function bubbleBabbleDecode(str) {
    const s = String(str).trim();
    if (s.length < 2 || s[0] !== 'x' || s[s.length - 1] !== 'x') {
      throw new Error('Bubble Babble 必须以 x 开头结尾');
    }
    // 注意 '-' 夹在一对辅音中间（C-C），不能按 '-' 切词；须按 VCV[C-C] 位置推进
    const inner = s.slice(1, -1);
    const out = [];
    let seed = 1, p = 0;
    while (p + 3 <= inner.length) {
      const a = BB_V.indexOf(inner[p]);
      const bb = BB_C.indexOf(inner[p + 1]);

    'yEnc':            { enc: s => yEncEncode(U.utf8Enc(s)),            dec: s => U.utf8Dec(yEncDecode(s)) },

    'T9 九宫格':       { enc: s => t9Encode(s),                         dec: s => t9Encode(s), selfInverse: false, oneWay: true }

    uuEncode, uuDecode,
    xxEncode, xxDecode, XX_A,
    a85Encode, a85Decode,
    b92Encode, b92Decode, B92,
    yEncEncode, yEncDecode,
    punycodeEncode, punycodeDecode, idnaEncode, idnaDecode,

    hexdump, hexdumpReverse, hexdumpReverseLoose,
    brailleEncode, brailleDecode, BRAILLE,
    dnaEncode, dnaDecode,

    const m = U.asBytes(b);
    const P = (1n << 88n) + 0x13Bn;              // 2^88 + 0x13B
    let h = 0x6C62272E07BB014262B821756295C58Dn;
    const M = (1n << 128n) - 1n;
    for (let i = 0; i < m.length; i++) h = ((h ^ BigInt(m[i])) * P) & M;
    let s = '';
    let t = h;
    for (let i = 0; i < 32; i++) { s = (t & 15n).toString(16) + s; t >>= 4n; }
    return s;
  }

  function bsdSum(b) {
    const m = U.asBytes(b);
    let s = 0;
    for (let i = 0; i < m.length; i++) {
      s = (((s >>> 1) + ((s & 1) << 15)) & 0xFFFF);
      s = (s + m[i]) & 0xFFFF;
    }
    return s;
  }

  function sysvSum(b) {
    const m = U.asBytes(b);
    let s = 0;
    for (let i = 0; i < m.length; i++) s += m[i];
    s = s >>> 0;
    while (s > 0xFFFF) s = ((s & 0xFFFF) + (s >>> 16)) >>> 0;
    return s & 0xFFFF;
  }

  /* =================== 算法表 =================== */
  const MAP = {
    'Whirlpool':      { fn: b => whirlpool(b), out: 64, kind: 'hash' },
    'SHAKE128':       { fn: b => shake128(b, 32), out: 32, kind: 'xof' },
    'SHAKE256':       { fn: b => shake256(b, 64), out: 64, kind: 'xof' },
    'SipHash-2-4':    { fn: b => siphash24(b, new Uint8Array(16)), out: 8, kind: 'keyed' },
    'Poly1305':       { fn: b => poly1305(b, new Uint8Array(32)), out: 16, kind: 'mac' },
    'Fletcher-16':    { fn: b => u16be(fletcher16(b)), out: 2, kind: 'checksum' },
    'Fletcher-32':    { fn: b => u32be(fletcher32(b)), out: 4, kind: 'checksum' },
    'ELFHash':        { fn: b => u32be(elfHash(b)), out: 4, kind: 'hash' },
    'OneAtATime':     { fn: b => u32be(oneAtATime(b)), out: 4, kind: 'hash' },
    'FNV-1a-128':     { fn: b => U.unhex(fnv1a128(b)), out: 16, kind: 'hash' },
    'BSDSum':         { fn: b => u16be(bsdSum(b)), out: 2, kind: 'checksum' },
    'SYSVSum':        { fn: b => u16be(sysvSum(b)), out: 2, kind: 'checksum' }
  };
  function u32be(v) { return U.packU32BE(v >>> 0); }
  function u16be(v) { return new Uint8Array([(v >>> 8) & 255, v & 255]); }

  return {
    whirlpool, shake128, shake256, siphash24, poly1305,
    fletcher16, fletcher32, elfHash, oneAtATime, fnv1a128, bsdSum, sysvSum,
    WS, MAP
  };
})();

/* 把新算法并入主哈希表，供 HMAC/统一入口使用（XOF/MAC 类不并入） */
(function mergeHash2() {
  const add = {
    'Whirlpool': { fn: CT.hash2.whirlpool, out: 64, block: 64, kind: 'hash' }
  };
  for (const k in add) if (!CT.hash.ALGOS[k]) CT.hash.ALGOS[k] = add[k];
})();

window.CT = CT;
})();
</script>

<script>
(function () {
  const CT = window.CT, U = CT.util;
  const $ = id => document.getElementById(id);
  const hex = b => U.hex(U.asBytes(b), false);

  /* ==================== 注册表 ==================== */
  const GROUPS = [];
  const addGroup = (name, items, note) => GROUPS.push({ name, items, note: note || '' });

  /* 1) 经典哈希：core 自有 + Whirlpool（不含 hashex / hash2 的其余项） */
  const HX = CT.hashex.MAP, H2 = CT.hash2.MAP;
  const CLASSIC = Object.keys(CT.hash.ALGOS).filter(k => !HX[k] && !H2[k]);
  addGroup('哈希', CLASSIC.map(k => {
    const a = CT.hash.ALGOS[k];
    return {
      name: k, oneWay: true, note: (a.out ? a.out + ' 字节摘要' : '32 位有符号整数'),
      enc: s => (k === 'JavaHash' ? U.utf8Dec(a.fn(U.utf8Enc(s))) : hex(a.fn(U.utf8Enc(s))))
    };
  }), 'MD / SHA / SHA-3 / RIPEMD / SM3 / CRC / Adler32 / Whirlpool');

  /* 2) 快速哈希（非密码学 + BLAKE2） */
  addGroup('快速哈希', Object.keys(HX).map(k => {
    const a = HX[k];
    return { name: k, oneWay: true, note: a.out + ' 字节 · ' + a.kind, enc: s => hex(a.fn(U.utf8Enc(s))) };
  }), 'BLAKE2 / FNV / xxHash / Murmur3 / DJB2 / SDBM / CRC-8·64 / NT-Hash');

  /* 3) 扩展哈希：XOF / 键控 / 校验和 */
  const h2Item = {
    'SHAKE128': { params: [{ k: 'len', label: '输出字节数', type: 'int', def: 32 }],
                  enc: (s, p) => hex(CT.hash2.shake128(U.utf8Enc(s), p.len || 32)) },
    'SHAKE256': { params: [{ k: 'len', label: '输出字节数', type: 'int', def: 64 }],
                  enc: (s, p) => hex(CT.hash2.shake256(U.utf8Enc(s), p.len || 64)) },
    'SipHash-2-4': { params: [{ k: 'key', label: '密钥（HEX，16 字节；留空用全零）', type: 'text', def: '' }],
                     enc: (s, p) => hex(CT.hash2.siphash24(U.utf8Enc(s), keyHex(p.key, 16))) },
    'Poly1305': { params: [{ k: 'key', label: '一次性密钥（HEX，32 字节；留空用全零）', type: 'text', def: '' }],
                  enc: (s, p) => hex(CT.hash2.poly1305(U.utf8Enc(s), keyHex(p.key, 32))) }
  };
  addGroup('扩展哈希', Object.keys(H2).map(k => {
    const a = H2[k], ex = h2Item[k];
    return {
      name: k, oneWay: true, note: a.out + ' 字节 · ' + a.kind,
      params: ex ? ex.params : [],
      enc: ex ? ex.enc : (s => hex(a.fn(U.utf8Enc(s))))
    };
  }), 'Whirlpool / SHAKE / SipHash / Poly1305 / Fletcher / ELF / Jenkins / FNV-1a-128 / sum');
  function keyHex(s, n) {
    const t = (s || '').replace(/\s+/g, '');
    if (!t) return new Uint8Array(n);
    const b = U.unhex(t);
    if (b.length !== n) throw new Error('需要 ' + n + ' 字节密钥（HEX ' + n * 2 + ' 位），实际 ' + b.length + ' 字节');
    return b;
  }

  /* 4) BASE 编码 */
  const BASE_LIST = [
    ['Base16', 'b16e', 'b16d'], ['Base32', 'b32e', 'b32d'], ['Base32-Hex', 'b32hexe', 'b32hexd'],
    ['Base36', 'b36e', 'b36d'], ['Base45', 'b45e', 'b45d'], ['Base58', 'b58e', 'b58d'],
    ['Base58Check', 'b58checke', 'b58checkd'], ['Base62', 'b62e', 'b62d'],
    ['Base64', 'b64e', 'b64d'], ['Base64-URL', 'b64ue', 'b64ud'],
    ['Base85(Ascii85)', 'b85e', 'b85d'], ['Base91', 'b91e', 'b91d'],
    ['Crockford-Base32', 'crocke', 'crockd'], ['Z85', 'z85e', 'z85d']
  ];
  const baseItems = BASE_LIST.map(([n, e, d]) => ({
    name: n, note: '字节 ↔ 文本',
    enc: s => CT.base[e](U.utf8Enc(s)),
    dec: s => U.utf8Dec(CT.base[d](s))
  }));
  // Z85 要求 4 字节一组：编码时右侧补 0x00 到 4 的倍数，解码时去掉补位的尾零
  const z85 = baseItems.find(x => x.name === 'Z85');
  z85.note = '字节 ↔ 文本（4 字节一组，不足时自动补 0x00）';
  z85.enc = s => {
    const b0 = U.utf8Enc(s);
    const pad = (4 - b0.length % 4) % 4;
    const b = pad ? (() => { const t = new Uint8Array(b0.length + pad); t.set(b0); return t; })() : b0;
    return CT.base.z85e(b);
  };
  z85.dec = s => {
    const b = CT.base.z85d(s);
    let n = b.length; while (n > 0 && b[n - 1] === 0) n--;
    return U.utf8Dec(b.subarray(0, n));
  };
  addGroup('BASE 编码', baseItems, 'Base16/32/36/45/58/62/64/85/91 + Crockford + Z85');

  /* 5) 对称加密 */
  const CIPHER_ALGOS = ['AES', 'DES', '3DES', 'SM4', 'RC4', 'XOR'];
  addGroup('对称加密', CIPHER_ALGOS.map(a => ({
    name: a,
    note: a === 'RC4' || a === 'XOR' ? '流密码：无分组模式与填充' : '分组密码：需选模式与填充',
    params: [
      { k: 'key', label: '密钥（文本）', type: 'text', def: '1234567890123456' },
      { k: 'keyHex', label: '密钥按 HEX 解析', type: 'bool', def: false },
      { k: 'mode', label: '模式', type: 'select', def: 'CBC', opts: ['ECB', 'CBC', 'CFB', 'OFB', 'CTR', 'PCBC'] },
      { k: 'padding', label: '填充', type: 'select', def: 'PKCS7', opts: ['PKCS7', 'Zero', 'ISO10126', 'None'] },
      { k: 'iv', label: 'IV（文本，可留空）', type: 'text', def: '' },
      { k: 'out', label: '密文输出', type: 'select', def: 'HEX', opts: ['HEX', 'Base64'] }
    ],
    enc: (s, p) => fmtOut(CT.cipher.encrypt({
      algo: a, mode: p.mode, padding: p.padding,
      key: keyBytes(p), iv: U.utf8Enc(p.iv || ''), data: U.utf8Enc(s)
    }), p.out),
    dec: (s, p) => U.utf8Dec(CT.cipher.decrypt({
      algo: a, mode: p.mode, padding: p.padding,
      key: keyBytes(p), iv: U.utf8Enc(p.iv || ''), data: parseIn(s, p.out)
    }))
  })), 'AES / DES / 3DES / SM4 / RC4 / XOR');
  function keyBytes(p) { return p.keyHex ? U.unhex((p.key || '').replace(/\s+/g, '')) : U.utf8Enc(p.key || ''); }
  function fmtOut(b, kind) { return kind === 'Base64' ? CT.base.b64e(U.asBytes(b)) : hex(b); }
  function parseIn(s, kind) { return kind === 'Base64' ? CT.base.b64d(s.trim()) : U.unhex(s.replace(/\s+/g, '')); }

  /* 6) 表驱动的工具组 */
  const toolGroup = (name, T, note) => addGroup(name, Object.keys(T).map(k => {
    const t = T[k];
    return {
      name: k, note: '', oneWay: !!t.oneWay, selfInverse: !!t.selfInverse,
      params: t.params || [],
      enc: (s, p) => t.enc(s, p),
      dec: (s, p) => t.dec(s, p)
    };
  }), note);
  toolGroup('古典密码', CT.classic.TOOLS, '凯撒 / 维吉尼亚 / Playfair / Hill / 栅栏 / ADFGVX …');
  toolGroup('中文趣味', CT.cncode.TOOLS, '与佛论禅 / 佛曰 / 核心价值观 / 脑洞 / 零宽 / 卦象 …');
  toolGroup('实用工具', CT.misc.TOOLS, 'URL / HTML / Unicode / 进制 / 反转 …');
  toolGroup('老式编码', CT.legacy.TOOLS, 'UU / XX / Ascii85 / Base92 / yEnc / Punycode / EBCDIC / 盲文 …');

  /* 7) RSA 专用入口 */
  addGroup('RSA', [{ name: 'RSA 密钥与运算', note: '生成 / 解析 / 加解密 / 签名 / 分解攻击', rsa: true }], '纯 JS 大数实现');

  /* 部分算法对默认样本不友好，给专属示例 */
  const SAMPLES = {
    '进制互转': '255',
    'URL 编码(整体)': 'https://example.com/a b?x=1&y=中文',
    '表单编码': 'name=张三&city=Beijing',
    'IDNA 域名': 'bücher.example',
    'Punycode': 'bücher',
    'Hexdump': 'Hello',
    'RSA 密钥与运算': 'Hello RSA'
  };

  /* ==================== 侧栏 ==================== */
  let cur = null, curGroup = 0;
  const nav = $('nav');
  function renderNav() {
    const filter = $('q').value.trim().toLowerCase();
    nav.innerHTML = '';
    GROUPS.forEach((g, gi) => {
      let items = g.items;
      if (filter) items = items.filter(it => (it.name + ' ' + g.name).toLowerCase().includes(filter));
      if (!items.length) return;
      const d = document.createElement('div');
      d.className = 'grp' + (curGroup === gi || filter ? ' open' : '');
      const h = document.createElement('button');
      h.className = 'gh';
      h.innerHTML = '<span>' + g.name + '</span><span class="cnt">' + items.length + '</span>';
      h.onclick = () => { curGroup = curGroup === gi ? null : gi; renderNav(); };
      d.appendChild(h);
      const box = document.createElement('div');
      box.className = 'items';
      items.forEach(it => {
        const b = document.createElement('button');
        b.textContent = it.name;
        if (cur && cur.name === it.name) b.className = 'on';
        b.onclick = () => { select(it); curGroup = gi; renderNav(); };
        box.appendChild(b);
      });
      d.appendChild(box);
      nav.appendChild(d);
    });
  }
  $('q').oninput = renderNav;

  /* ==================== 参数区 ==================== */
  let paramVals = {};
  function select(it) {
    cur = it;                                   // 选中即生效（外部调用 select 也能直接 run）
    $('title').firstChild.nodeValue = it.name;
    const tag = $('tag');
    tag.style.display = it.oneWay ? 'inline-block' : 'none';
    tag.textContent = it.oneWay ? '单向' : '';
    $('desc').textContent = it.note || '';
    $('bEnc').style.display = it.rsa ? 'none' : '';
    $('bDec').style.display = (it.rsa || it.oneWay) ? 'none' : '';
    $('rsaPanel').style.display = it.rsa ? 'block' : 'none';
    if (it.rsa) $('desc').textContent = '生成 / 解析 RSA 密钥，进行加解密、签名验签与模数分解攻击（下方专用面板）';

    const box = $('params'); box.innerHTML = ''; paramVals = {};
    if (it.params && it.params.length) {
      const g = document.createElement('div');
      g.className = 'grid3';
      it.params.forEach(p => {
        paramVals[p.k] = p.def;
        const f = document.createElement('div'); f.className = 'field';
        const l = document.createElement('label'); l.textContent = p.label; f.appendChild(l);
        let el;
        if (p.type === 'select' || p.type === 'bool') {
          el = document.createElement('select');
          const opts = p.type === 'bool' ? ['false', 'true'] : p.opts;
          opts.forEach(o => { const o1 = document.createElement('option'); o1.value = o1.textContent = o; el.appendChild(o1); });
          el.value = String(p.def);
          el.onchange = () => { paramVals[p.k] = p.type === 'bool' ? (el.value === 'true') : el.value; };
        } else {
          el = document.createElement('input'); el.type = 'text'; el.value = String(p.def);
          el.oninput = () => { paramVals[p.k] = p.type === 'int' ? (parseInt(el.value, 10) || 0) : el.value; };
        }
        f.appendChild(el); g.appendChild(f);
      });
      box.appendChild(g);
    }
    $('in').value = SAMPLES[it.name] !== undefined ? SAMPLES[it.name] : ($('in').value || 'Hello, 世界! 123');
    $('inlen').textContent = $('in').value.length + ' 字符';
  }

  /* ==================== 执行 ==================== */
  function run(dir) {
    if (!cur) { say('请先从左侧选择算法', 'err'); return; }
    if (cur.rsa) { say('请使用下方 RSA 面板的按钮', 'err'); return; }
    const s = $('in').value;
    try {
      const fn = dir === 'enc' ? (cur.enc || cur.run) : cur.dec;
      if (!fn) { say('该算法不支持' + (dir === 'enc' ? '编码' : '解码'), 'err'); return; }
      const r = fn(s, paramVals);
      $('out').value = typeof r === 'string' ? r : String(r);
      $('outlen').textContent = $('out').value.length + ' 字符';
      say('完成 · ' + $('out').value.length + ' 字符', 'ok');
    } catch (e) { say('错误：' + (e && e.message ? e.message : e), 'err'); }
  }
  function say(m, k) { const st = $('st'); st.textContent = m; st.className = 'status ' + (k || ''); }
  $('bEnc').onclick = () => run('enc');
  $('bDec').onclick = () => run('dec');
  $('bSwap').onclick = () => { const a = $('in').value; $('in').value = $('out').value; $('out').value = a; $('inlen').textContent = $('in').value.length + ' 字符'; };
  $('bCopy').onclick = async () => {
    const t = $('out').value;
    try { await navigator.clipboard.writeText(t); say('已复制', 'ok'); }
    catch (e) { $('out').select(); try { document.execCommand('copy'); say('已复制', 'ok'); } catch (e2) { say('复制失败，请手动选中', 'err'); } }
  };
  $('bClear').onclick = () => { $('in').value = ''; $('out').value = ''; say(''); };
  $('in').oninput = () => { $('inlen').textContent = $('in').value.length + ' 字符'; };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run('enc'); }
  });

  /* ==================== RSA 面板 ==================== */
  const RSA = CT.rsa;
  let rsaKey = null;
  function rsaPadOpt() {
    const pad = $('rsaPad').value;
    return pad === 'Raw' ? { padding: 'Raw' }
         : pad.startsWith('OAEP') ? { padding: 'OAEP', hash: pad === 'OAEP-SHA256' ? 'SHA-256' : 'SHA-1' }
         : { padding: 'PKCS1v15' };
  }
  $('rsaGen').onclick = () => {
    try {
      const bits = parseInt($('rsaBits').value, 10);
      const e = BigInt($('rsaE').value.trim() || '65537');
      const t0 = performance.now();
      rsaKey = RSA.generate(bits, e);
      $('rsaKey').value = JSON.stringify({ n: rsaKey.n.toString(), e: rsaKey.e.toString(), d: rsaKey.d.toString() }, null, 1);
      say('已生成 ' + bits + ' 位密钥（n 实际 ' + rsaKey.n.toString(2).length + ' 位，用时 ' + Math.round(performance.now() - t0) + ' ms）', 'ok');
    } catch (err) { say('生成失败：' + err.message, 'err'); }
  };
  $('rsaParse').onclick = () => {
    try {
      const t = $('rsaKey').value.trim();
      if (!t) throw new Error('请先粘贴 PEM 或 {n,e,d} JSON');
      if (t.startsWith('-----')) rsaKey = RSA.parseKey(t);
      else {
        const o = JSON.parse(t);
        rsaKey = (o.d && o.n) ? RSA.keyFromNED(String(o.n), String(o.e || '65537'), String(o.d)) : RSA.parseKey(t);
      }
      say('已载入密钥 · ' + (rsaKey.bits || '?') + ' 位 · ' + (rsaKey.kind || ''), 'ok');
    } catch (err) { say('解析失败：' + err.message, 'err'); }
  };
  $('rsaShow').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入密钥');
      const parts = [];
      if (rsaKey.n && rsaKey.e) parts.push(RSA.exportPkcs1Public(rsaKey));
      if (rsaKey.d) parts.push(RSA.exportPkcs1Private(rsaKey));
      $('out').value = parts.join('\n');
      say('已导出 PEM 到输出框' + (rsaKey.d ? '（公钥 PKCS#1 + 私钥 PKCS#1）' : '（仅公钥，当前密钥无私钥部分）'), 'ok');
    } catch (err) { say(err.message, 'err'); }
  };
  $('rsaFactor').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入密钥');
      const bits = rsaKey.n.toString(2).length;
      if (bits > 256 && !confirm('模数 n 为 ' + bits + ' 位，暴力分解可能长时间无解并卡住页面。\n' +
        '（仅对弱密钥有效：p/q 接近、小因子、e 或 d 过小）\n确定继续？')) { say('已取消', ''); return; }
      const t0 = performance.now();
      const r = RSA.autoFactor(rsaKey.n, rsaKey.e);
      $('out').value = JSON.stringify({ p: r.p.toString(), q: r.q.toString(), method: r.method, ms: Math.round(performance.now() - t0) }, null, 1);
      say('分解成功 · ' + r.method, 'ok');
    } catch (err) { say('分解失败：' + err.message, 'err'); }
  };
  $('rsaEnc').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入密钥');
      const o = rsaPadOpt();
      const c = RSA.encrypt({ key: rsaKey, data: U.utf8Enc($('in').value), padding: o.padding, hash: o.hash });
      $('out').value = hex(c);
      say('已加密 · ' + c.length + ' 字节（' + o.padding + '）', 'ok');
    } catch (err) { say('加密失败：' + err.message, 'err'); }
  };
  $('rsaDec').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入含私钥的密钥');
      const o = rsaPadOpt();
      const m = RSA.decrypt({ key: rsaKey, data: U.unhex($('in').value.replace(/\s+/g, '')), padding: o.padding, hash: o.hash });
      $('out').value = U.utf8Dec(m);
      say('已解密', 'ok');
    } catch (err) { say('解密失败：' + err.message, 'err'); }
  };
  $('rsaSign').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入含私钥的密钥');
      const sig = RSA.sign({ key: rsaKey, data: U.utf8Enc($('rsaMsg').value || $('in').value), hash: 'SHA-256' });
      $('out').value = hex(sig);
      say('已签名（SHA-256 / PKCS#1 v1.5）', 'ok');
    } catch (err) { say('签名失败：' + err.message, 'err'); }
  };
  $('rsaVer').onclick = () => {
    try {
      if (!rsaKey) throw new Error('请先生成或载入密钥');
      const ok = RSA.verify({ key: rsaKey, data: U.utf8Enc($('rsaMsg').value || $('in').value),
                              signature: U.unhex($('in').value.replace(/\s+/g, '')), hash: 'SHA-256' });
      say(ok ? '验签通过 ✓' : '验签失败 ✗', ok ? 'ok' : 'err');
    } catch (err) { say('验签出错：' + err.message, 'err'); }
  };

  /* ==================== 初始化 ==================== */
  const total = GROUPS.reduce((s, g) => s + g.items.length, 0);
  $('stat').textContent = GROUPS.length + ' 大类 / ' + total + ' 个算法';
  cur = GROUPS[0].items.find(i => i.name === 'SHA-256') || GROUPS[0].items[0];
  select(cur);
  renderNav();
  window.__CT_UI = { GROUPS, run, select, get cur() { return cur; } };
})();
</script>
